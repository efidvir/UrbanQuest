<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141a36">
  <title>הקוד של אודי · Udi's code</title>
  <meta name="description" content="Habima quest: help Udi the caretaker find the code he hid in the garden paths.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playpen+Sans+Hebrew:wght@400;600&family=Rubik:wght@400;500;700&family=Secular+One&display=swap">
  <script type="importmap">
    {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js"}}
  </script>
  <style>
    :root {
      --night: #141a36;
      --sky: #1d2550;
      --line: rgba(255, 255, 255, .16);
      --ink: #f6f0e1;
      --muted: #b8bedb;
      --gold: #ffc94a;
      --gold-ink: #2b1e00;
      --paper: #f8f0da;
      --paper-line: #e4d7b3;
      --paper-ink: #3a2e22;
      --margin: #e8a7a0;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--ink); }
    body {
      font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-text-size-adjust: 100%;
    }
    button, a { font-family: inherit; }
    [hidden] { display: none !important; }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(10px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
    .brand { font-size: 13px; color: var(--muted); }
    .pill {
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .07);
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .screen { display: none; flex-direction: column; gap: 16px; }
    .screen.on { display: flex; animation: rise .35s ease both; }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

    h1, h2 { font-family: "Secular One", Rubik, sans-serif; font-weight: 400; margin: 0; line-height: 1.15; }
    h1 { font-size: 38px; color: var(--gold); }
    h2 { font-size: 27px; }
    p { margin: 0; font-size: 17px; line-height: 1.65; }
    .lead { display: flex; flex-direction: column; gap: 10px; }
    .muted { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .art { display: block; width: 100%; height: auto; border-radius: 22px; background: var(--sky); direction: ltr; }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border: 0;
      border-radius: 15px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
      background: var(--gold);
      color: var(--gold-ink);
      cursor: pointer;
    }
    .btn small { display: block; font-size: 13px; font-weight: 400; opacity: .8; margin-top: 3px; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(255, 255, 255, .32); font-weight: 500; }
    .btn:active { transform: scale(.985); }
    .btn[disabled] { opacity: .5; pointer-events: none; }
    .stack { display: flex; flex-direction: column; gap: 10px; }

    .rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; counter-reset: r; }
    .rules li { counter-increment: r; display: flex; gap: 12px; align-items: flex-start; font-size: 16.5px; line-height: 1.55; }
    .rules li::before {
      content: counter(r);
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--gold-ink);
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .badge {
      align-self: flex-start;
      font-size: 13px;
      color: var(--gold);
      border: 1px dashed rgba(255, 201, 74, .7);
      background: rgba(255, 201, 74, .1);
      border-radius: 999px;
      padding: 5px 12px;
    }

    /* Udi's diary paper */
    .paper {
      position: relative;
      background-color: var(--paper);
      color: var(--paper-ink);
      border-radius: 6px 16px 16px 6px;
      padding: 16px 18px 18px 44px;
      background-image:
        linear-gradient(to right, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px),
        repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 34px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
    }
    [dir="rtl"] .paper {
      border-radius: 16px 6px 6px 16px;
      padding: 16px 44px 18px 18px;
      background-image:
        linear-gradient(to left, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px),
        repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 34px);
    }
    .hand { font-family: "Playpen Sans Hebrew", Rubik, sans-serif; }
    .quote { font-size: 19px; line-height: 1.75; }
    .quote::before { content: "“"; }
    .quote::after { content: "”"; }
    [dir="rtl"] .quote::before { content: "”"; }
    [dir="rtl"] .quote::after { content: "“"; }

    /* Diary pages: only used when the camera can't start */
    .page { min-height: 250px; display: flex; flex-direction: column; gap: 14px; }
    .page.flip { animation: flip .35s ease; }
    @keyframes flip { from { opacity: .15; transform: translateX(16px) rotate(.8deg); } to { opacity: 1; transform: none; } }
    [dir="rtl"] .page.flip { animation-name: flip-rtl; }
    @keyframes flip-rtl { from { opacity: .15; transform: translateX(-16px) rotate(-.8deg); } to { opacity: 1; transform: none; } }
    .turn { display: flex; align-items: center; gap: 12px; }
    .turn svg {
      flex: none;
      width: 56px;
      height: 56px;
      padding: 6px;
      border-radius: 15px;
      color: #9a6a00;
      background: rgba(255, 201, 74, .32);
    }
    .turn strong { display: block; font-size: 23px; line-height: 1.2; color: #2a2116; }
    .turn span { display: block; font-size: 15px; color: #6b5b45; }
    .noink { font-size: 14px; color: #6b5b45; }
    .peek { position: absolute; bottom: 0; inset-inline-end: 16px; width: 66px; height: 38px; }
    .walkhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    .progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s ease; }
    .ready-title { font-family: "Secular One", Rubik, sans-serif; font-size: 24px; }

    .diary-list { list-style: none; margin: 0; display: flex; flex-direction: column; gap: 0; }
    .paper.diary-list { background-image: linear-gradient(to right, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px); }
    [dir="rtl"] .paper.diary-list { background-image: linear-gradient(to left, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px); }
    .diary-list li { display: flex; gap: 10px; align-items: flex-start; min-height: 34px; padding: 4px 0; }
    .diary-list li + li { border-top: 1px solid var(--paper-line); }
    .diary-list .n { flex: none; width: 22px; font-size: 13px; color: #8a7a62; padding-top: 6px; text-align: center; }
    .diary-list svg { flex: none; width: 26px; height: 26px; color: #9a6a00; margin-top: 2px; }
    .diary-list .hand { font-size: 16px; line-height: 1.6; }

    .map-label { fill: #ece6d4; font: 500 13px Rubik, sans-serif; }

    /* Art animations: each animated part pivots on the origin of its parent group */
    .anim { transform-origin: 0 0; }
    @media (prefers-reduced-motion: no-preference) {
      .a-scratch { animation: scratch .55s ease-in-out infinite; }
      .a-bob { animation: bob 1.8s ease-in-out infinite; }
      .a-tail { animation: tail 2.2s ease-in-out infinite; }
      .a-blink { animation: blink 1.1s step-end infinite; }
      .a-tw { animation: tw 2.8s ease-in-out infinite; }
      .a-fall { animation: fall 7s linear infinite; }
      .a-z { animation: zz 3s ease-in infinite; }
      .a-ear { animation: ear 3.6s ease-in-out infinite; }
      .a-pulse { animation: pulse 1.6s ease-out infinite; }
      .a-jingle { animation: jingle 2.6s ease-in-out infinite; }
      .a-read { animation: read 4s ease-in-out infinite; }
      .a-step { animation: step 1.6s ease-in-out infinite; }
    }
    @keyframes scratch { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .15; } }
    @keyframes tw { 0%, 100% { opacity: .95; } 50% { opacity: .25; } }
    @keyframes fall {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(-40px, 190px) rotate(260deg); opacity: 0; }
    }
    @keyframes zz { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(10px, -26px); opacity: 0; } }
    @keyframes ear { 0%, 86%, 100% { transform: rotate(0deg); } 90% { transform: rotate(-16deg); } 95% { transform: rotate(7deg); } }
    @keyframes pulse { 0% { transform: scale(.6); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }
    @keyframes jingle { 0%, 80%, 100% { transform: rotate(0deg); } 85% { transform: rotate(14deg); } 90% { transform: rotate(-10deg); } 95% { transform: rotate(6deg); } }
    @keyframes read { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes step { 0%, 100% { opacity: .25; } 35% { opacity: 1; } }

    /* AR mode: the camera view, with Udi, Mitzi and the footprints in it */
    #camerafeed { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
    body.ar #camerafeed { display: block; }
    body.ar #app { display: none; }
    #ar {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    }
    body.ar #ar { display: flex; }
    .ar-top { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
    .ar-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 34px;
      background: rgba(20, 24, 48, .78);
      color: #fff;
      border-radius: 999px;
      padding: 6px 13px;
      font-size: 15px;
      font-weight: 700;
    }
    .ar-pill svg { width: 20px; height: 20px; }
    #ar-count { display: flex; align-items: center; gap: 6px; direction: ltr; unicode-bidi: isolate; }
    #ar-key { display: flex; }
    #ar-dot { width: 10px; height: 10px; border-radius: 50%; background: #f5a623; transition: background .3s; }
    #ar-dot.good { background: #3ccf7a; }
    #ar-status {
      background: rgba(176, 112, 0, .92);
      color: #fff;
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
    }
    #ar .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; max-width: 480px; width: 100%; margin: 0 auto; }
    #ar-panel {
      pointer-events: auto;
      align-self: stretch;
      background: rgba(20, 24, 48, .9);
      color: #fff;
      border-radius: 20px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      text-align: center;
    }
    #ar-panel p { font-size: 16px; line-height: 1.5; }
    .tilt { width: 64px; height: 64px; margin: 0 auto; display: block; }
    .tilt .phone { transform-origin: 32px 50px; animation: tilt 2.4s ease-in-out infinite; }
    @keyframes tilt { 0%, 100% { transform: rotate(-12deg); } 50% { transform: rotate(12deg); } }
    #ar-here {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 0;
      border-radius: 999px;
      padding: 12px 22px 12px 16px;
      background: var(--gold);
      color: var(--gold-ink);
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 6px 18px rgba(0, 0, 0, .4);
      cursor: pointer;
    }
    #ar-here svg { width: 30px; height: 30px; flex: none; }
    #ar-here:active { transform: scale(.96); }
    #ar-here.pulse { animation: here 1.6s ease-in-out infinite; }
    @keyframes here { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 201, 74, .7), 0 6px 18px rgba(0, 0, 0, .4); } 50% { box-shadow: 0 0 0 14px rgba(255, 201, 74, 0), 0 6px 18px rgba(0, 0, 0, .4); } }
    #credit { font-size: 10px; color: rgba(255, 255, 255, .85); text-align: center; text-shadow: 0 1px 2px #000; pointer-events: auto; }
    #credit a { color: inherit; }

    /* Speech bubbles and diary notes, pinned to Udi, Mitzi or a crossing in the camera view */
    #ar-bubble {
      position: fixed;
      left: 0;
      top: 0;
      z-index: 12;
      max-width: min(76vw, 330px);
      background: #fff;
      color: #1d2550;
      border-radius: 18px;
      padding: 11px 15px;
      font: 600 17px/1.45 "Playpen Sans Hebrew", Rubik, sans-serif;
      box-shadow: 0 8px 22px rgba(0, 0, 0, .35);
      pointer-events: auto;
      display: none;
      cursor: pointer;
    }
    body.ar #ar-bubble.on { display: block; animation: pop .25s ease both; }
    @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
    #ar-bubble::after {
      content: "";
      position: absolute;
      left: 50%;
      bottom: -10px;
      margin-left: -10px;
      border: 10px solid transparent;
      border-top-color: #fff;
      border-bottom: 0;
    }
    #ar-bubble.note { background: var(--paper); color: var(--paper-ink); font-weight: 400; font-size: 15px; border-radius: 4px 14px 14px 4px; }
    #ar-bubble.note::after { border-top-color: var(--paper); }

    #ar-exit {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      inset-inline-end: 14px;
      z-index: 2147483000;
      display: none;
      background: #fff;
      color: #1b1b22;
      border: 0;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    }
    body.ar #ar-exit { display: block; }

    #error {
      position: fixed;
      inset-inline: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 2147483001;
      display: none;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(170, 30, 40, .95);
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <canvas id="camerafeed"></canvas>

  <div id="app">
    <header class="bar">
      <span class="brand" data-l="kicker"></span>
      <button id="lang" class="pill" type="button"></button>
    </header>

    <section class="screen on" id="s-loading">
      <p class="muted">…</p>
    </section>

    <section class="screen" id="s-intro">
      <div id="art-intro"></div>
      <h1 data-l="title"></h1>
      <div class="lead" id="story"></div>
      <button class="btn" type="button" data-go="s-rules" data-t="helpUdi"></button>
    </section>

    <section class="screen" id="s-rules">
      <div id="art-how"></div>
      <h2 data-t="howTitle"></h2>
      <ol class="rules" id="rules"></ol>
      <button class="btn" type="button" data-go="s-start" data-t="next"></button>
    </section>

    <section class="screen" id="s-start">
      <h2 data-l="start.title"></h2>
      <div id="art-map"></div>
      <span class="badge" id="start-note" data-l="start.note"></span>
      <p data-l="start.text"></p>
      <p class="muted" id="room" hidden></p>
      <div class="stack">
        <button class="btn" type="button" id="btn-ar"><span data-t="startAR"></span><small id="ar-sub"></small></button>
        <button class="btn ghost" type="button" id="btn-resume" hidden></button>
      </div>
    </section>

    <section class="screen" id="s-walk">
      <div class="walkhead">
        <span class="muted" id="w-progress"></span>
        <button class="pill" type="button" id="w-exit" data-t="exit"></button>
      </div>
      <div class="progress"><i id="w-bar"></i></div>
      <div class="paper page" id="w-page" aria-live="polite"></div>
      <div class="stack">
        <button class="btn" type="button" id="w-next"></button>
        <button class="btn ghost" type="button" id="w-prev" data-t="prevPage"></button>
      </div>
    </section>

    <section class="screen" id="s-end">
      <div id="art-end"></div>
      <h2 data-l="end.title"></h2>
      <div class="paper"><p class="hand quote" data-l="end.udi"></p></div>
      <p data-l="end.task"></p>
      <div class="stack">
        <a class="btn" id="to-tq" href="https://travelandquest.com/"><span data-t="backToTQ"></span><small data-t="backToTQsub"></small></a>
        <p class="muted" data-t="backHint"></p>
        <button class="btn ghost" type="button" data-go="s-diary" data-t="readDiary"></button>
        <button class="btn ghost" type="button" id="btn-again" data-t="walkAgain"></button>
      </div>
    </section>

    <section class="screen" id="s-diary">
      <h2 data-t="diaryTitle"></h2>
      <ol class="paper diary-list" id="diary-list"></ol>
      <button class="btn" type="button" data-go="s-end" data-t="back"></button>
    </section>
  </div>

  <div id="ar">
    <div class="ar-top">
      <div class="ar-pill"><span id="ar-dot"></span><span id="ar-count"></span><span id="ar-key" hidden></span></div>
      <div id="ar-status" hidden></div>
    </div>
    <div class="bottom">
      <div id="ar-panel" hidden>
        <div id="ar-panel-text"></div>
        <button class="btn" type="button" id="ar-panel-btn" hidden></button>
      </div>
      <button type="button" id="ar-here" hidden><span id="ar-here-icon"></span><span id="ar-here-label"></span></button>
      <div id="credit">
        AR engine © 2026 Niantic Spatial, Inc. · Used under the
        <a href="https://github.com/8thwall/engine/blob/main/LICENSE" target="_blank" rel="noopener">XR Engine License Agreement</a>
        · Provided “as is”, without warranty.
      </div>
    </div>
  </div>
  <div id="ar-bubble" role="status"></div>
  <button id="ar-exit" class="pill" type="button" data-t="exit"></button>
  <div id="error" role="alert"></div>

  <script type="module">
    // ---------- Settings ----------
    // ?r=garden      which riddle file to load from riddles/
    // ?lang=he|en    language (otherwise the phone's language, then the riddle's default)
    // ?cell=0.5      square size in metres, for testing at home (skips measuring it on the first stretch)
    // ?auto=0|1      advance automatically when the player reaches the next crossing
    // ?trail=1       keep the walked footprints visible
    // ?screen=s-end  open a screen directly (for checking the page)
    const params = new URLSearchParams(location.search)
    const RIDDLE_ID = (params.get('r') || 'garden').replace(/[^\w-]/g, '')
    const SCALE = params.get('scale') === 'absolute' ? 'absolute' : 'responsive'
    const KEEP_TRAIL = params.get('trail') === '1'
    const CAMERA_HEIGHT = 1.4      // phone height; in 'responsive' mode units ≈ metres
    const JUMP = 1.0               // a jump this big in one frame = tracking reset
    const LOST_AFTER_MS = 2000     // limited tracking this long = lost
    const FADE_MS = 4000           // how long walked footprints stay visible
    const ENGINE = {
      xr: 'https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js',
      extras: 'https://cdn.jsdelivr.net/npm/@8thwall/xrextras@1/dist/xrextras.js',
      landing: 'https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js',
    }

    // ---------- Words on the page ----------
    const UI = {
      he: {
        langName: 'English',
        helpUdi: 'עזרו לאודי',
        howTitle: 'איך משחקים',
        next: 'הבא',
        startAR: 'פותחים את המצלמה',
        startARsub: 'אודי ומיצי מחכים לכם בגינה',
        arPhoneOnly: 'עובד בטלפון עם מצלמה',
        resume: 'להמשיך מקטע {n}',
        readyTitle: 'מוכנים?',
        readyText: 'עמדו בנקודת ההתחלה עם הפנים לקצה הרחוק של הדשא. כל דף ביומן מוביל אתכם לצומת הבא.',
        readyResume: 'חזרו לצומת שבו עצרתם ועמדו עם הפנים לכיוון שבו הלכתם.',
        imThere: 'אני בנקודה, מתחילים',
        page: 'דף {n} מתוך {total}',
        atCrossing: 'הגעתי לצומת',
        atFirstCrossing: 'הגעתי לצומת הראשון',
        prevPage: 'לדף הקודם',
        exit: 'יציאה',
        toCrossingTurn: 'והמשיכו עד הצומת הבא',
        toCrossingStraight: 'עד הצומת הבא',
        toLastCrossing: 'וחזרו לצומת הקודם',

        for (let i = 0; i < times; i++) out.push({dx, dy, ink: m[1] !== '~'})

    // ---------- Screens ----------
    const show = (id) => {
      document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id))

    }
    document.addEventListener('click', (e) => {

    const pageHtml = (i) => {

      const line = get(riddle, `diary.${lang}`)?.[i]
      return `
        <div class="turn">${turnIcon(turn)}<div><strong>${esc(t(`turn.${turn}`))}</strong><span>${esc(suffix)}</span></div></div>
        ${ROUTE[i].ink ? '' : `<p class="noink">${esc(t('noInk'))}</p>`}
        ${line ? `<p class="hand quote">${esc(line)}</p>` : ''}`
    }

    const roomText = () => {
      let x = 0, y = 0, minX = 0, maxX = 0, minY = 0, maxY = 0
      for (const m of ROUTE) {
        x += m.dx
        y += m.dy
        minX = Math.min(minX, x)
        maxX = Math.max(maxX, x)
        minY = Math.min(minY, y)
        maxY = Math.max(maxY, y)
      }
      const m = (squares) => +(squares * CELL).toFixed(1)
      const parts = []
      if (maxY) parts.push(t('ahead', {m: m(maxY)}))
      if (minY) parts.push(t('behind', {m: m(-minY)}))
      if (minX) parts.push(t('left', {m: m(-minX)}))
      if (maxX) parts.push(t('right', {m: m(maxX)}))
      return parts.join(', ')
    }

    // ---------- Progress, so a reload doesn't lose the walk ----------
    const PKEY = `urbanquest-riddle-${RIDDLE_ID}`
    const saveProgress = () => store.set(PKEY, JSON.stringify({seg, mode, cell: cellKnown ? CELL : null, key: gotKey}))
    const loadProgress = () => safe(() => JSON.parse(store.get(PKEY) || 'null'))
    const clearProgress = () => store.del(PKEY)

    let wakeLock = null
    const keepAwake = async () => { try { wakeLock = await navigator.wakeLock?.request('screen') } catch { wakeLock = null } }
    const letSleep = () => { try { wakeLock?.release() } catch {} wakeLock = null }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && walkingNow()) keepAwake()
    })

    const isPhone = () => matchMedia('(pointer: coarse)').matches

    const prepareStart = () => {
      const saved = loadProgress()
      const resume = $('#btn-resume')
      if (saved && saved.seg > 0 && saved.seg < N) {
        resume.hidden = false
        resume.textContent = t('resume', {n: saved.seg + 1})
      } else {
        resume.hidden = true
      }
      // Fetch the AR engine in the background, so the camera starts faster.
      if (isPhone()) loadEngine().catch(() => {})
    }

    // ---------- Render everything in the current language ----------
    const render = () => {
      const he = lang === 'he'
      document.documentElement.lang = lang
      document.documentElement.dir = he ? 'rtl' : 'ltr'
      document.title = `${L(riddle.title)} · ${L(riddle.kicker)}`
      $('#lang').textContent = t('langName')
      $('#story').innerHTML = (get(riddle, `story.${lang}`) || []).map((p) => `<p>${esc(p)}</p>`).join('')
      $('#rules').innerHTML = (get(riddle, `rules.${lang}`) || []).map((r) => `<li>${esc(r)}</li>`).join('')
      $('#start-note').hidden = !(riddle.start && riddle.start.placeholder)
      $('#ar-sub').textContent = isPhone() ? t('startARsub') : t('arPhoneOnly')
      const room = $('#room')
      room.hidden = !params.has('cell')
      room.textContent = t('room', {room: roomText()})
      $('#diary-list').innerHTML = TURNS.map((turn, i) => `
        <li><span class="n">${i + 1}</span>${turnIcon(turn)}<span class="hand">${esc(get(riddle, `diary.${lang}`)?.[i] || t(`turn.${turn}`))}</span></li>`).join('')
      $('#to-tq').href = tqUrl()
      document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t) })
      document.querySelectorAll('[data-l]').forEach((el) => { el.textContent = L(get(riddle, el.dataset.l)) })
      if ($('#s-start').classList.contains('on')) prepareStart()
      if ($('#s-walk').classList.contains('on')) renderDiaryPage(false)
    }
    $('#lang').addEventListener('click', () => {
      lang = lang === 'he' ? 'en' : 'he'
      store.set('urbanquest-lang', lang)
      render()
    })

    // ---------- Shared walk state ----------
    let mode = null      // 'ar' | 'diary'
    let seg = 0          // the stretch being walked now (0-based)
    let gotKey = false
    let diaryState = 'ready'
    const walkingNow = () => (mode === 'diary' && $('#s-walk').classList.contains('on')) || document.body.classList.contains('ar')

    const finish = () => {
      clearProgress()
      letSleep()
      mode = null

    // ---------- Diary pages: the fallback when the camera can't start ----------
    const startDiary = (from = 0) => {

      seg = from

      keepAwake()
      show('s-walk')

    const renderDiaryPage = (animate = true) => {
      const pageEl = $('#w-page')
      const ready = diaryState === 'ready'
      $('#w-progress').textContent = ready ? '' : t('page', {n: seg + 1, total: N})
      $('#w-bar').style.width = `${(seg / N) * 100}%`
      pageEl.innerHTML = ready
        ? `<div class="ready-title">${esc(t('readyTitle'))}</div><p>${esc(seg > 0 ? t('readyResume') : t('readyText'))}</p>${peekArt()}`
        : pageHtml(seg) + peekArt()
      $('#w-next').textContent = ready ? t('imThere') : t('atCrossing')
      $('#w-prev').hidden = ready || seg === 0
      if (animate) {
        pageEl.classList.remove('flip')
        void pageEl.offsetWidth
        pageEl.classList.add('flip')
      }
    }
    $('#w-next').addEventListener('click', () => {
      if (diaryState === 'ready') {

      } else {

        if (seg >= N) return finish()
        saveProgress()
      }
      renderDiaryPage()
    })
    $('#w-prev').addEventListener('click', () => {

      renderDiaryPage()

    $('#btn-ar').addEventListener('click', () => startAR(0))
    $('#btn-resume').addEventListener('click', () => {

      else startAR(from)

    $('#btn-again').addEventListener('click', () => {
      clearProgress()

    // ---------- Back to TravelQuest ----------
    // Logins there are per site, so go back to whichever TravelQuest site the player came from.
    const TQ_HOST = /(^|\.)(travelandquest\.com|travelquest\.xyz)$/i
    const fromTQ = safe(() => {
      const ref = document.referrer ? new URL(document.referrer) : null
      if (ref && TQ_HOST.test(ref.hostname)) {

        return true
      }
      return false
    }, false)
    const tqUrl = () => {
      const tq = (riddle && riddle.travelQuest) || {}
      const origin = session.get('urbanquest-tq-origin') || tq.origin || 'https://travelandquest.com'

    }
    $('#to-tq').addEventListener('click', (e) => {

    })

    // ---------- AR: Udi, Mitzi and glowing footprints on the real ground (8th Wall SLAM) ----------
    let THREE = null
    let enginePromise = null
    let pipelineAdded = false
    let scene, camera
    let state = 'off'            // off | loading | ready | intro | walking | lost | outro | failed
    let trackingSeen = false
    let limitedSince = 0
    let fwd, right, UP
    let segStart = null
    let segEnd = null
    let segDir = null
    let segLen = 0
    let lastPos = null
    let lastFrame = 0
    let calibrating = false      // the first stretch measures how big the squares really are
    let auto = false             // advance by itself when the player reaches the next crossing
    let prints = []              // footprints of the stretch being walked
    let fading = []              // footprints already walked: {meshes, born}
    let ring = null
    let props = []               // things Udi left on the paths
    let sprites = null           // the drawings, as textures
    let mitzi = null
    let udi = null
    let footGeometry = null
    let talk = null              // speech bubble or diary note showing now
    let actScale = 1             // Udi and Mitzi are life size in the garden, smaller at home
    const GOLD = 0xFFB300
    const WHITE = 0xFFFFFF

    const loadScript = (src, attrs = {}) => new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = src
      s.crossOrigin = 'anonymous'
      for (const [k, v] of Object.entries(attrs)) s.setAttribute(k, v)
      s.onload = resolve
      s.onerror = () => reject(new Error(`Couldn't load ${src}`))
      document.head.appendChild(s)
    })
    const loadEngine = () => {
      enginePromise = enginePromise || (async () => {
        const three = await import('three')
        window.THREE = three  // the 8th Wall three.js module reads window.THREE
        await loadScript(ENGINE.extras)
        await loadScript(ENGINE.landing)
        const loaded = new Promise((resolve) => {
          if (window.XR8) resolve()
          else window.addEventListener('xrloaded', resolve, {once: true})
        })
        await loadScript(ENGINE.xr, {'data-preload-chunks': 'slam'})
        await loaded
        return three
      })()
      enginePromise.catch(() => { enginePromise = null })  // allow a retry later
      return enginePromise
    }

    // The drawings become flat cut-outs standing on the ground. vb = the drawing's viewBox, h = height in metres.
    const SPRITE = {
      mitziSit: {vb: '-30 -58 76 62', h: 0.45, art: () => mitziSitting(false, false)},
      mitziWalkA: {vb: '-36 -52 72 54', h: 0.39, art: () => mitziWalk(0)},
      mitziWalkB: {vb: '-36 -52 72 54', h: 0.39, art: () => mitziWalk(1)},
      udiWaveA: {vb: '-76 -182 152 186', h: 1.71, art: () => udiWave(-150)},
      udiWaveB: {vb: '-76 -182 152 186', h: 1.71, art: () => udiWave(-122)},
      udiRead: {vb: '-76 -182 152 186', h: 1.71, art: () => udiReading(false)},
      key: {vb: '-30 -14 60 28', h: 0.13, art: keyArt},
      cup: {vb: '-16 -38 38 42', h: 0.15, art: cupArt},
    }
    const spriteSvg = ({vb, art}) => {
      const [, , w, h] = vb.split(' ').map(Number)
      const k = 512 / Math.max(w, h)
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w * k)}" height="${Math.round(h * k)}" viewBox="${vb}">${art()}</svg>`
    }
    const loadTexture = (svg) => new Promise((resolve) => {
      const img = new Image()
      img.onload = () => {
        try {
          const c = document.createElement('canvas')
          c.width = img.naturalWidth
          c.height = img.naturalHeight
          const g = c.getContext('2d')
          g.drawImage(img, 0, 0)
          g.getImageData(0, 0, 1, 1)  // throws if this browser won't let a drawing become a texture
          const tx = new THREE.CanvasTexture(c)
          tx.colorSpace = THREE.SRGBColorSpace
          resolve(tx)
        } catch {
          resolve(null)
        }
      }
      img.onerror = () => resolve(null)
      img.src = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`
    })
    const loadSprites = async () => {
      if (sprites) return
      const out = {}
      await Promise.all(Object.keys(SPRITE).map(async (k) => { out[k] = await loadTexture(spriteSvg(SPRITE[k])) }))
      sprites = out
    }

    // A cut-out standing on the ground, with a soft shadow. It turns to face the camera each frame.
    const standee = (name, scale) => {
      const spec = SPRITE[name]
      const [, , w, h] = spec.vb.split(' ').map(Number)
      const height = spec.h * scale
      const group = new THREE.Group()
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(height * (name.startsWith('udi') ? 0.13 : 0.3), 24),
        new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false}))
      shadow.rotation.x = -Math.PI / 2
      shadow.position.y = 0.003
      group.add(shadow)
      let card
      if (sprites && sprites[name]) {
        const geo = new THREE.PlaneGeometry((height * w) / h, height)
        geo.translate(0, height / 2, 0)
        card = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: sprites[name], transparent: true, alphaTest: 0.04, side: THREE.DoubleSide, depthWrite: false}))
      } else {
        // The drawing didn't load on this phone: a glowing marker stands in for it.
        card = new THREE.Mesh(new THREE.SphereGeometry(height * 0.3, 16, 12), new THREE.MeshBasicMaterial({color: GOLD, transparent: true}))
        card.position.y = height * 0.3
      }
      card.renderOrder = 3
      group.add(card)
      group.userData = {card, shadow, name, height}
      return group
    }
    const setPicture = (st, name) => {
      if (st.userData.name === name || !sprites || !sprites[name]) return
      st.userData.card.material.map = sprites[name]
      st.userData.name = name
    }
    const faceCamera = (st, at = st.position) => {
      st.userData.card.rotation.y = Math.atan2(camera.position.x - at.x, camera.position.z - at.z)
    }
    const setOpacity = (st, o) => {
      st.userData.card.material.opacity = o
      st.userData.shadow.material.opacity = 0.18 * o
    }

    const groundPos = () => new THREE.Vector3(camera.position.x, 0, camera.position.z)
    const facing = () => {
      const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)
      f.y = 0
      if (f.lengthSq() < 1e-6) f.set(0, 0, -1)
      return f.normalize()
    }
    const aimAxes = () => {
      fwd = facing()
      right = new THREE.Vector3().crossVectors(fwd, UP).normalize()
    }
    const sideOf = (dir) => new THREE.Vector3(-dir.z, 0, dir.x)

    const buildThree = () => {
      UP = new THREE.Vector3(0, 1, 0)
      fwd = new THREE.Vector3(0, 0, -1)
      right = new THREE.Vector3(1, 0, 0)
      // A shoe print: sole and heel, lying flat with the toe pointing along -Z.
      const sole = new THREE.Shape()
      sole.absellipse(0, 0.1, 0.042, 0.08, 0, Math.PI * 2, false, 0)
      const heel = new THREE.Shape()
      heel.absellipse(0, -0.035, 0.034, 0.042, 0, Math.PI * 2, false, 0)
      footGeometry = new THREE.ShapeGeometry([sole, heel], 12)
      footGeometry.rotateX(-Math.PI / 2)
    }

    const flatRing = (pos, inner, outer, color) => {
      const m = new THREE.Mesh(
        new THREE.RingGeometry(inner, outer, 48),
        new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false})
      )
      m.rotation.x = -Math.PI / 2
      m.position.set(pos.x, 0.012, pos.z)
      return m
    }

    // ---------- Footprints ----------
    const footScale = () => Math.max(0.45, Math.min(1, CELL / 1.5))
    const layPrints = (from, dir, len, ink) => {
      const s = footScale()
      const n = Math.max(2, Math.round(len / (0.34 * s)))
      const side = sideOf(dir)
      const out = []
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(footGeometry, new THREE.MeshBasicMaterial({color: ink ? GOLD : WHITE, transparent: true, opacity: 0, depthWrite: false}))
        m.position.copy(from).addScaledVector(dir, ((i + 0.5) * len) / n).addScaledVector(side, (i % 2 ? 1 : -1) * 0.065 * s)
        m.position.y = 0.006
        m.rotation.y = Math.atan2(-dir.x, -dir.z)
        m.scale.setScalar(s)
        m.userData.i = i
        m.userData.tail = 1
        scene.add(m)
        out.push(m)
      }
      return out
    }
    const animatePrints = (tt, now) => {
      // The stretch to walk: prints light up one after another, as if someone walks it just ahead of you.
      for (const p of prints) {
        const wave = Math.max(0, Math.sin(tt * 3.2 - p.userData.i * 0.55))
        p.material.opacity = (0.22 + 0.78 * wave) * p.userData.tail
      }
      // Walked stretches glow, then fade: the picture only lives in the player's head.
      fading = fading.filter((f) => {
        const k = KEEP_TRAIL ? 0 : (now - f.born) / FADE_MS
        if (k >= 1) {
          f.meshes.forEach((m) => scene.remove(m))
          return false
        }
        f.meshes.forEach((m) => { m.material.opacity = 0.9 * (1 - k) * m.userData.tail })
        return true
      })
      if (ring) ring.material.opacity = 0.55 + 0.35 * Math.sin(tt * 4)
    }
    const clearStretch = () => {
      for (const p of prints) scene.remove(p)
      prints = []
      if (ring) scene.remove(ring)
      ring = null
    }
    const dropLastFading = () => {
      const last = fading.pop()
      if (last) last.meshes.forEach((m) => scene.remove(m))
    }
    const dropAllFading = () => {
      fading.forEach((f) => f.meshes.forEach((m) => scene.remove(m)))
      fading = []
    }

    // ---------- Mitzi: runs ahead to the next crossing and waits there ----------
    const makeMitzi = (pos) => {
      const sit = standee('mitziSit', actScale)
      const walk = standee('mitziWalkA', actScale)
      walk.visible = false
      const group = new THREE.Group()
      group.add(sit, walk)
      group.position.copy(pos)
      scene.add(group)
      return {group, sit, walk, mode: 'sit', from: null, to: null, t0: 0, dur: 0, heading: new THREE.Vector3(1, 0, 0)}
    }
    const mitziSpeed = () => Math.max(1, Math.min(3, CELL * 0.8))
    const mitziRunTo = (point) => {
      mitzi.from = mitzi.group.position.clone()
      mitzi.to = point.clone()
      mitzi.t0 = performance.now()
      mitzi.dur = Math.max(450, (mitzi.from.distanceTo(point) / mitziSpeed()) * 1000)
      mitzi.mode = 'run'
    }
    const mitziHead = () => (mitzi ? mitzi.group.position.clone().add(new THREE.Vector3(0, 0.55 * actScale, 0)) : null)
    const updateMitzi = (now, dt) => {
      if (!mitzi) return
      let moving = false
      const pos = mitzi.group.position
      if (mitzi.mode === 'run') {
        const k = Math.min(1, (now - mitzi.t0) / mitzi.dur)
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
        pos.lerpVectors(mitzi.from, mitzi.to, e)
        mitzi.heading.subVectors(mitzi.to, mitzi.from)
        moving = k < 1
        if (!moving) mitzi.mode = 'sit'
      } else if (mitzi.mode === 'follow') {
        // First stretch, while the size of the squares is still unknown: lead the player a step or two ahead.
        const done = Math.max(0, groundPos().sub(segStart).dot(segDir))
        const target = segStart.clone().addScaledVector(segDir, Math.min(done + 1.4 * actScale, segLen * 1.5))
        const gap = target.sub(pos)
        gap.y = 0
        const d = gap.length()
        if (d > 0.08) {
          pos.addScaledVector(gap.normalize(), Math.min(d, mitziSpeed() * dt))
          mitzi.heading.copy(gap)
          moving = true
        }
      }
      mitzi.sit.visible = !moving
      mitzi.walk.visible = moving
      if (moving) {
        setPicture(mitzi.walk, Math.floor(now / 130) % 2 ? 'mitziWalkA' : 'mitziWalkB')
        mitzi.walk.userData.card.position.y = Math.abs(Math.sin((now / 130) * Math.PI)) * 0.025 * actScale
        const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion)
        mitzi.walk.userData.card.scale.x = mitzi.heading.dot(camRight) < 0 ? -1 : 1
      } else {
        mitzi.sit.userData.card.scale.y = 1 + Math.sin(now / 600) * 0.015
      }
      faceCamera(mitzi.sit, pos)
      faceCamera(mitzi.walk, pos)
    }

    // ---------- Udi: greets the player at the start, and asks what he wrote at the end ----------
    const hideUdi = () => {
      if (udi) scene.remove(udi)
      udi = null
    }
    const showUdi = (pos, pose) => {
      hideUdi()
      udi = standee(pose === 'read' ? 'udiRead' : 'udiWaveA', actScale)
      udi.position.copy(pos)
      udi.userData.pose = pose
      udi.userData.born = performance.now()
      setOpacity(udi, 0)
      scene.add(udi)
    }
    const udiDistance = () => 2.4 * actScale + 0.5
    const udiHeadPos = () => (udi ? udi.position.clone().add(new THREE.Vector3(0, 1.8 * actScale, 0)) : null)
    const updateUdi = (now) => {
      if (!udi) return
      if (udi.userData.leaving) {
        const k = Math.min(1, (now - udi.userData.leaving) / 600)
        setOpacity(udi, 1 - k)
        if (k >= 1) hideUdi()
        return
      }
      setOpacity(udi, Math.min(1, (now - udi.userData.born) / 500))
      if (udi.userData.pose === 'wave') setPicture(udi, Math.floor(now / 380) % 2 ? 'udiWaveA' : 'udiWaveB')
      faceCamera(udi)
    }

    // ---------- Things Udi left on the paths: the empty coffee cup, the dropped keys ----------
    const placeProps = () => {
      for (const p of get(riddle, 'ar.props') || []) {
        if (p.page !== seg + 1 || !SPRITE[p.item]) continue
        const st = standee(p.item, actScale)
        st.position.copy(segEnd)
        st.userData.page = p.page
        st.userData.collect = !!p.collect
        st.userData.item = p.item
        scene.add(st)
        props.push(st)
      }
    }
    const collectProps = (page) => {
      props = props.filter((st) => {
        if (!st.userData.collect || st.userData.page !== page) return true
        scene.remove(st)
        if (st.userData.item === 'key') gotKey = true
        if (navigator.vibrate) navigator.vibrate([30, 40, 30])
        return false
      })
    }
    const clearProps = () => {
      props.forEach((st) => scene.remove(st))
      props = []
    }
    const updateProps = (tt) => {
      for (const st of props) {
        if (st.userData.collect) st.userData.card.position.y = (0.2 + Math.sin(tt * 2.6) * 0.05) * actScale
        faceCamera(st)
      }
    }

    // ---------- Speech bubbles and diary notes, pinned to a point in the camera view ----------
    const bubbleEl = $('#ar-bubble')
    const readMs = (s) => Math.min(9000, 1700 + s.length * 60)
    const hideBubble = () => {
      talk = null
      bubbleEl.classList.remove('on')
    }
    const showTalk = (lines, anchor, done, kind) => {
      if (!lines || !lines.length) {
        if (done) done()
        return
      }
      talk = {lines, i: 0, anchor, done, kind, until: performance.now() + readMs(lines[0])}
      bubbleEl.className = kind === 'note' ? 'note on' : 'on'
      bubbleEl.textContent = lines[0]
      placeBubble()
    }
    const say = (lines, anchor, done) => showTalk(lines, anchor, done, 'say')
    const note = (line, anchor) => showTalk([line], anchor, null, 'note')
    const nextLine = () => {
      if (!talk) return
      talk.i++
      if (talk.i >= talk.lines.length) {
        const done = talk.done
        hideBubble()
        if (done) done()
        return
      }
      talk.until = performance.now() + readMs(talk.lines[talk.i])
      bubbleEl.textContent = talk.lines[talk.i]
    }
    bubbleEl.addEventListener('click', nextLine)
    const placeBubble = () => {
      if (!talk || !camera) return
      const p = talk.anchor && talk.anchor()
      const w = innerWidth
      const h = innerHeight
      let x = w / 2
      let y = h * 0.32
      if (p) {
        const v = p.project(camera)
        if (v.z < 1) {
          x = ((v.x + 1) / 2) * w
          y = ((1 - v.y) / 2) * h
        }
      }
      x = Math.min(w - 100, Math.max(100, x))
      y = Math.min(h - 210, Math.max(120, y))
      bubbleEl.style.transform = `translate(${x.toFixed(0)}px, ${y.toFixed(0)}px) translate(-50%, -100%)`
    }

    // ---------- The few words on top of the camera view ----------
    let panelAction = null
    const panel = (html, label = null, action = null) => {
      $('#ar-panel').hidden = false
      $('#ar-panel-text').innerHTML = html
      const btn = $('#ar-panel-btn')
      btn.hidden = !label
      btn.textContent = label || ''
      panelAction = action
    }
    const hidePanel = () => {
      $('#ar-panel').hidden = true
      panelAction = null
    }
    $('#ar-panel-btn').addEventListener('click', () => { if (panelAction) panelAction() })
    const setHere = (on) => {
      $('#ar-here').hidden = !on
      $('#ar-here-icon').innerHTML = PAW
      $('#ar-here-label').textContent = calibrating ? t('atFirstCrossing') : t('atCrossing')
      $('#ar-here').classList.toggle('pulse', calibrating)
    }
    $('#ar-here').addEventListener('click', () => completeStretch(true))
    const updateCount = () => {
      $('#ar-count').innerHTML = `${PAW}${state === 'intro' ? '' : `${Math.min(seg + 1, N)} / ${N}`}`
      $('#ar-key').hidden = !gotKey
      $('#ar-key').innerHTML = KEY_ICON
    }
    const setStatus = (text, good) => {
      $('#ar-dot').classList.toggle('good', !!good)
      $('#ar-status').hidden = !text
      $('#ar-status').textContent = text || ''
    }

    const hasIntro = () => (get(riddle, `ar.intro.${lang}`) || []).length > 0
    const readyPanel = () => {
      if (!trackingSeen) return panel(`${PHONE_TILT}<p>${esc(t('pointGround'))}</p>`)
      panel(`<p>${esc(seg > 0 ? t('arResume') : t('arReady'))}</p>`, t('go'), () => (seg === 0 && hasIntro() ? startIntro() : beginWalk(true)))
    }
    const lostPanel = () => panel(`<p>${esc(t('lost'))}</p>`, t('cont'), continueAfterLost)
    const failedPanel = () => panel(`<p>${esc(t('arFail'))}</p>`, t('playNoCamera'), () => {
      stopAR()
      startDiary(seg)
    })

    // ---------- The walk, step by step ----------
    const startAR = async (from = 0) => {
      mode = 'ar'
      seg = from
      const saved = loadProgress()
      gotKey = !!(from > 0 && saved && saved.key)
      if (from > 0 && saved && saved.cell && !params.has('cell')) {
        CELL = saved.cell
        cellKnown = true
      }
      calibrating = !cellKnown && !!get(riddle, 'ar.calibrate')
      auto = params.has('auto') ? params.get('auto') === '1' : cellKnown
      saveProgress()
      document.body.classList.add('ar')
      state = 'loading'
      trackingSeen = false
      limitedSince = 0
      setStatus('', false)
      setHere(false)
      updateCount()
      panel(`<p>${esc(t('loadingAR'))}</p>`)
      keepAwake()
      try {
        THREE = await loadEngine()
        await loadSprites()
      } catch {
        state = 'failed'
        failedPanel()
        return
      }
      if (!document.body.classList.contains('ar')) return  // they left while it loaded
      if (!footGeometry) buildThree()
      actScale = Math.max(0.5, Math.min(1, CELL / 2))
      if (!pipelineAdded) {
        XR8.XrController.configure({scale: SCALE})
        XR8.addCameraPipelineModules([
          XR8.GlTextureRenderer.pipelineModule(),      // draws the camera feed
          XR8.Threejs.pipelineModule(),                // three.js scene synced to the camera
          XR8.XrController.pipelineModule(),           // SLAM world tracking
          LandingPage.pipelineModule(),                // desktop: shows a QR code to open on a phone
          XRExtras.FullWindowCanvas.pipelineModule(),  // full-screen canvas
          XRExtras.Loading.pipelineModule(),           // loading screen + camera/motion permission prompts
          XRExtras.RuntimeError.pipelineModule(),      // error screen
          walkModule(),
        ])
        pipelineAdded = true
      }
      XR8.run({canvas: $('#camerafeed')})
    }

    const clearScene = () => {
      if (!scene) return
      clearStretch()
      dropAllFading()
      clearProps()
      if (mitzi) scene.remove(mitzi.group)
      mitzi = null
      hideUdi()
      hideBubble()
    }

    const stopAR = () => {
      clearScene()
      safe(() => window.XR8 && XR8.stop())
      document.body.classList.remove('ar')
      document.documentElement.removeAttribute('style')
      document.body.removeAttribute('style')
      state = 'off'
      hidePanel()
      letSleep()
    }
    $('#ar-exit').addEventListener('click', () => {
      stopAR()
      mode = null
      show('s-start')
    })

    // Udi waits at the start, waves, and tells the player what to do; then Mitzi takes over.
    const startIntro = () => {
      state = 'intro'
      clearScene()
      aimAxes()
      hidePanel()
      setHere(false)
      updateCount()
      const pos = groundPos().addScaledVector(fwd, udiDistance())
      showUdi(pos, 'wave')
      mitzi = makeMitzi(pos.clone().addScaledVector(right, 0.6 * actScale))
      say(get(riddle, `ar.intro.${lang}`), udiHeadPos, () => {
        if (udi) udi.userData.leaving = performance.now()
        beginWalk(false)
      })
    }

    const beginWalk = (reaim) => {
      if (reaim) {
        clearScene()
        aimAxes()
      }
      state = 'walking'
      hidePanel()
      const here = groundPos()
      lastPos = here
      startStretch(here)
    }

    const startStretch = (start) => {
      clearStretch()
      const move = ROUTE[seg]
      const dir = new THREE.Vector3().addScaledVector(right, move.dx).addScaledVector(fwd, move.dy)
      const len = dir.length() * CELL
      dir.normalize()
      segStart = start.clone()
      segDir = dir
      segLen = len
      segEnd = start.clone().addScaledVector(dir, len)
      if (TURNS[seg] === 'back') dropLastFading()   // walking straight back: clear the old prints at once
      prints = layPrints(start, dir, calibrating ? len * 1.5 : len, move.ink)
      if (calibrating) {
        // The real length isn't known yet, so the prints just fade out ahead of the player.
        prints.forEach((p) => { p.userData.tail = Math.min(1, (prints.length - p.userData.i) / (prints.length * 0.4)) })
      } else {
        const s = footScale()
        ring = flatRing(segEnd, 0.2 * s, 0.29 * s, move.ink ? GOLD : WHITE)
        scene.add(ring)
      }
      if (!mitzi) mitzi = makeMitzi(start.clone().addScaledVector(dir, 0.6 * actScale))
      if (calibrating) mitzi.mode = 'follow'
      else mitziRunTo(segEnd)
      placeProps()
      updateCount()
      setHere(true)
      const line = get(riddle, `diary.${lang}`)?.[seg]
      if (line && (!talk || talk.kind === 'note')) {
        const end = segEnd.clone()
        note(line, calibrating ? mitziHead : () => end.clone().add(new THREE.Vector3(0, 0.75 * actScale, 0)))
      }
    }

    // byTap: the player says they're at the crossing, so the next stretch starts at their feet
    // (tracking drift never builds up). Otherwise they came within reach of it, and it starts at the crossing itself.
    const completeStretch = (byTap) => {
      if (state !== 'walking') return
      const here = groundPos()
      if (calibrating) {
        // Every stretch is one side of a square, so the first one tells us how big the squares are.
        const walked = here.distanceTo(segStart)
        if (walked >= 0.8 && walked <= 9) CELL = walked
        cellKnown = true
        calibrating = false
        auto = params.has('auto') ? params.get('auto') === '1' : true
      }
      const anchor = byTap ? here : segEnd.clone()
      fading.push({meshes: prints, born: performance.now()})
      prints = []
      collectProps(seg + 1)
      seg++
      if (navigator.vibrate) navigator.vibrate(40)
      if (seg >= N) return startOutro()
      saveProgress()
      startStretch(anchor)
      lastPos = here
    }

    const enterLost = () => {
      state = 'lost'
      clearStretch()
      setHere(false)
      if (talk && talk.kind === 'note') hideBubble()
      lostPanel()
    }

    const continueAfterLost = () => {
      // Everything placed so far belongs to the old, slipped frame.
      dropAllFading()
      collectProps(seg + 1)
      clearProps()
      aimAxes()
      seg++
      limitedSince = 0
      const here = groundPos()
      lastPos = here
      if (mitzi) mitzi.group.position.copy(here).addScaledVector(right, 0.5 * actScale)
      if (seg >= N) return startOutro()
      saveProgress()
      state = 'walking'
      hidePanel()
      startStretch(here)
    }

    // At the last crossing Udi is back, reading his diary: "so... what did I write?"
    const startOutro = () => {
      state = 'outro'
      clearStretch()
      clearProps()
      setHere(false)
      hideBubble()
      clearProgress()
      updateCount()
      const f = facing()
      const pos = groundPos().addScaledVector(f, udiDistance())
      showUdi(pos, 'read')
      if (mitzi) mitziRunTo(pos.clone().addScaledVector(sideOf(f), 0.6 * actScale))
      say(get(riddle, `ar.outro.${lang}`), udiHeadPos, finishAr)
    }

    const finishAr = () => {
      stopAR()
      finish()
    }

    // Our camera pipeline module
    const walkModule = () => ({
      name: 'udis-garden-walk',

      onStart: ({canvas}) => {
        const xr = XR8.Threejs.xrScene()
        scene = xr.scene
        camera = xr.camera
        camera.position.set(0, CAMERA_HEIGHT, 0)
        XR8.XrController.updateCameraProjectionMatrix({origin: camera.position, facing: camera.quaternion})
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false})
        state = 'ready'
        lastFrame = performance.now()
        setStatus(t('stMove'), false)
        readyPanel()
        // Safety net: if no tracking event arrives, still let the player start after a few seconds.
        setTimeout(() => {
          if (trackingSeen) return
          trackingSeen = true
          if (state === 'ready') readyPanel()
        }, 5000)
      },

      onUpdate: () => {
        if (!scene) return
        const now = performance.now()
        const dt = Math.min(0.05, (now - lastFrame) / 1000)
        lastFrame = now
        const tt = now / 1000
        animatePrints(tt, now)
        updateMitzi(now, dt)
        updateUdi(now)
        updateProps(tt)
        if (talk && now > talk.until) nextLine()
        placeBubble()

        if (state !== 'walking') return
        const here = groundPos()

        // A sudden jump, or weak tracking for a while, means the world origin slipped.
        if (lastPos && here.distanceTo(lastPos) > JUMP) return enterLost()
        if (limitedSince && now - limitedSince > LOST_AFTER_MS) return enterLost()
        lastPos = here

        // Arrived = near the crossing and well along the stretch (so turning straight back can't skip a stretch).
        if (!auto || calibrating) return
        const arrive = Math.min(0.9, Math.max(0.25, 0.35 * segLen))
        const along = here.clone().sub(segStart).dot(segDir)
        if (here.distanceTo(segEnd) < arrive && along > 0.6 * segLen) completeStretch(false)
      },

      listeners: [{
        event: 'reality.trackingstatus',
        process: ({detail}) => {
          const {status, reason} = detail || {}
          if (status === 'NORMAL') {
            limitedSince = 0
            setStatus('', true)
            if (!trackingSeen) {
              trackingSeen = true
              if (state === 'ready') readyPanel()
            }
            return
          }
          if (!limitedSince) limitedSince = performance.now()
          if (reason === 'INITIALIZING') setStatus(t('stInit'), false)
          else if (reason === 'TOO_MUCH_MOTION') setStatus(t('stFast'), false)
          else if (reason === 'NOT_ENOUGH_TEXTURE') setStatus(t('stTexture'), false)
          else setStatus(t('stLimited'), false)
        },
      }],

      onCameraStatusChange: ({status}) => {
        if (status === 'failed') {
          state = 'failed'
          failedPanel()
        }
      },

      onException: (err) => {
        let msg = err && err.message
        if (!msg) msg = safe(() => JSON.stringify(err), String(err))
        showError(`AR error: ${msg}`)
      },
    })

    // ---------- Start ----------
    const pickLang = () => {
      const q = params.get('lang')
      if (q === 'he' || q === 'en') return q
      const saved = store.get('urbanquest-lang')
      if (saved === 'he' || saved === 'en') return saved
      const phone = (navigator.language || '').slice(0, 2)
      if (phone === 'he' || phone === 'iw') return 'he'
      if (phone === 'en') return 'en'
      return riddle.defaultLang || 'he'
    }

    const boot = async () => {
      try {
        const res = await fetch(`riddles/${RIDDLE_ID}.json`, {cache: 'no-cache'})
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        riddle = await res.json()
        ROUTE = parseRoute(riddle.route)
      } catch (err) {
        $('#s-loading').innerHTML = `<p>${esc(UI.he.loadFail)}</p><p>${esc(UI.en.loadFail)}</p><p class="muted">${esc(err.message)}</p>`
        return
      }
      TURNS = turnsOf(ROUTE)
      N = ROUTE.length
      const cell = parseFloat(params.get('cell'))
      CELL = Math.min(8, Math.max(0.5, cell || riddle.cell || 1))
      cellKnown = !!cell || !get(riddle, 'ar.calibrate')
      lang = pickLang()
      $('#art-intro').innerHTML = introArt()
      $('#art-how').innerHTML = howArt()
      $('#art-map').innerHTML = mapArt()
      $('#art-end').innerHTML = endArt()
      render()
      const first = params.get('screen')
      show(first && document.getElementById(first) ? first : 's-intro')
    }
    boot()
  </script>
</body>
</html>
