      for (let i = 0; i < 12; i++) desk += `<rect x="${210 + i * 9}" y="${rows[0] - 5}" width="6" height="10" rx="1" fill="${i < 9 ? '#ffd46b' : '#3a3f58'}"/>`
      desk += `<rect x="312" y="${rows[0] - 7}" width="24" height="14" rx="3" fill="#0a1913"/><text x="324" y="${rows[0] + 4}" text-anchor="middle" font-size="10" font-family="Courier New, monospace" font-weight="700" fill="#9ff0c0">9</text>`
      desk += `<rect x="212" y="${rows[1] - 14}" width="120" height="28" rx="4" fill="#0a1913" stroke="#040907"/>`
      for (const x of [228, 272, 316]) desk += `<rect x="${x - 15}" y="${rows[2] - 9}" width="30" height="18" rx="4" fill="#2c3148" stroke="#56607e"/>`
      desk += `<path d="M214 ${rows[3]}c8-8 16-8 24 0s16 8 24 0 16-8 24 0 16 8 24 0" fill="none" stroke="#c48b4f" stroke-width="3" stroke-linecap="round"/>`
      for (let i = 0; i < 7; i++) {
        const x = 214 + i * 17
        desk += `<rect x="${x + 5}" y="${rows[4] - 12}" width="3" height="30" rx="1" fill="#06070d"/><rect x="${x}" y="${rows[4] - 2 + (i % 3) * 4}" width="13" height="8" rx="2" fill="#d9dce8" stroke="#10121e"/>`
      }
      const links = rows.map((y) => `<path d="M166 ${y}H196" stroke="${gold}" stroke-width="1.5" stroke-dasharray="3 3"/>`).join('')
      return `<svg class="art" viewBox="0 0 360 210" role="img" aria-label=""><rect width="360" height="210" fill="#1d2550"/>${sq}${desk}${links}</svg>`
    }

    // ---------- A clue page from the original mission, kept exactly as it was ----------
    $('#clue-open').addEventListener('click', () => {
      $('#viewer-img').src = $('#clue-img').src
      $('#viewer-img').classList.remove('big')
      $('#viewer').hidden = false
    })
    $('#viewer-img').addEventListener('dblclick', () => $('#viewer-img').classList.toggle('big'))
    $('#viewer-close').addEventListener('click', () => { $('#viewer').hidden = true })

    // ---------- The story so far: a short film before the first mission ----------
    // Plays with sound after a tap; the captions come from the riddle file, in both languages.
    const storyVideo = $('#story-video')
    let storyWatched = false
    const storyCaption = () => {
      let line = ''
      for (const c of get(riddle, 'film.captions') || []) if (storyVideo.currentTime >= c.t) line = L(c)
      $('#story-caption').textContent = line
    }
    const storyLabel = () => { $('#story-play-label').textContent = storyWatched ? t('watchAgain') : t('watchStory') }
    const stopStory = () => { if (storyVideo.src && !storyVideo.paused) storyVideo.pause() }
    $('#story-play').addEventListener('click', () => {
      storyVideo.muted = false
      storyVideo.currentTime = 0
      $('#story-play').hidden = true
      const p = storyVideo.play()
      if (p && p.catch) p.catch(() => { $('#story-play').hidden = false })
    })
    storyVideo.addEventListener('timeupdate', storyCaption)
    storyVideo.addEventListener('ended', () => {
      storyWatched = true
      storyLabel()
      $('#story-play').hidden = false
      $('#story-next').classList.add('pulse')
    })
    $('#story-next').addEventListener('click', () => show('s-intro'))

    // ---------- Which screen comes after the story, for each kind of riddle ----------
    let TYPE = 'walk'
    const play = () => {
      if (TYPE === 'key') return startKey()
      if (TYPE === 'console') return startConsole()
      if (TYPE === 'clue') return show('s-clue')
      show('s-start')
    }
    $('#btn-help').addEventListener('click', () => ((get(riddle, `rules.${lang}`) || []).length ? show('s-rules') : play()))
    $('#btn-play').addEventListener('click', play)

    // ---------- Start ----------
    const pickLang = () => {
      const q = params.get('lang')
      if (q === 'he' || q === 'en') return q
      const saved = store.get('urbanquest-lang')
      if (saved === 'he' || saved === 'en') return saved
      const phone = (navigator.language || '').slice(0, 2)
      if (phone === 'he' || phone === 'iw') return 'he'
      if (phone === 'en') return 'en'
      return riddle.defaultLang || 'he'
    }

    // The drawing shows at once; a picture file, if the riddle names one, replaces it when it has loaded.
    // With a video too, the scene plays its animation once when its screen opens, then settles on the
    // picture (the clip's last frame). Tapping a settled scene plays it again, with sound.
    const showArt = (sel, file, drawing, video = null) => {
      const el = $(sel)
      el.innerHTML = drawing
      if (!file) return
      const img = new Image()
      img.className = 'art'
      img.alt = ''
      img.onload = () => {
        el.classList.add('scene')
        if (video) {
          el.dataset.video = video
          el.dataset.still = file
          el.classList.add('has-video')
          settleScene(el, false)
          if (el.closest('.screen.on') && !el.dataset.played) {   // its screen is already open
            el.dataset.played = '1'
            playScene(el)
          }
        } else {
          el.replaceChildren(img)
        }
      }
      img.src = file
    }
    const settleScene = (el, fade = true) => {
      const img = new Image()
      img.className = fade ? 'art settled' : 'art'
      img.alt = ''
      img.src = el.dataset.still
      const again = document.createElement('button')
      again.type = 'button'
      again.className = 'replay'
      again.setAttribute('aria-label', t('playAgain'))
      again.innerHTML = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="currentColor"/></svg>'
      el.replaceChildren(img, again)
      el.dataset.state = 'still'
    }
    const playScene = (el, sound = false) => {
      if (!el || !el.dataset.video || el.dataset.state === 'playing') return
      const v = document.createElement('video')
      v.className = 'art'
      v.muted = !sound
      v.playsInline = true
      v.setAttribute('playsinline', '')
      v.preload = 'auto'
      v.poster = el.dataset.video.replace(/\.mp4$/, '-first.webp')
      v.src = el.dataset.video
      v.addEventListener('ended', () => settleScene(el))
      v.addEventListener('error', () => settleScene(el, false))
      el.replaceChildren(v)
      el.dataset.state = 'playing'
      const p = v.play()
      if (p && p.catch) p.catch(() => settleScene(el, false))   // autoplay blocked: just show the picture
    }
    // Scenes animate the first time their screen opens; leaving a screen stops its clip.
    const playScenesIn = (screenId) => {
      document.querySelectorAll('.scene.has-video').forEach((el) => {
        const here = el.closest('.screen') && el.closest('.screen').id === screenId
        if (here && !el.dataset.played) {
          el.dataset.played = '1'
          playScene(el)
        } else if (!here && el.dataset.state === 'playing') {
          settleScene(el, false)
        }
      })
    }
    document.addEventListener('click', (e) => {
      const sc = e.target.closest('.scene.has-video')
      if (sc && sc.dataset.state === 'still') playScene(sc, true)
    })

    const boot = async () => {
      try {
        const res = await fetch(`riddles/${RIDDLE_ID}.json`, {cache: 'no-cache'})
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        riddle = await res.json()
        TYPE = ['key', 'clue', 'console'].includes(riddle.type) ? riddle.type : 'walk'
        if (TYPE === 'walk') ROUTE = parseRoute(riddle.route)
      } catch (err) {
        $('#s-loading').innerHTML = `<p>${esc(UI.he.loadFail)}</p><p>${esc(UI.en.loadFail)}</p><p class="muted">${esc(err.message)}</p>`
        return
      }
      TURNS = turnsOf(ROUTE)
      N = ROUTE.length
      const cell = parseFloat(params.get('cell'))
      CELL = Math.min(8, Math.max(0.5, cell || riddle.cell || 1))
      cellKnown = !!cell || !get(riddle, 'ar.calibrate')
      lang = pickLang()
      showArt('#art-intro', get(riddle, 'art.intro'), introArt(), get(riddle, 'art.introVideo'))
      showArt('#art-how', get(riddle, 'art.how'), TYPE === 'key' ? keyHowArt() : TYPE === 'console' ? consoleHowArt() : howArt())
      if (TYPE === 'walk') $('#art-map').innerHTML = mapArt()
      showArt('#art-end', get(riddle, 'art.end'), endArt(), get(riddle, 'art.endVideo'))
      if (riddle.film && riddle.film.src) {
        storyVideo.poster = riddle.film.src.replace(/\.mp4$/, '-first.webp')
        storyVideo.src = riddle.film.src
      }
      if (TYPE === 'clue') $('#clue-img').src = get(riddle, 'clue.image') || ''
      if (TYPE !== 'walk') $('#btn-again').hidden = true
      render()
      // ?screen= opens a screen directly, for checking the page; "key", "console" and "compass" start those modes.
      const first = params.get('screen')
      if (first === 'key' && TYPE === 'key') return startKey()
      if (first === 'console' && TYPE === 'console') return startConsole()
      if (first === 'compass' && TYPE === 'walk') return startCompass(0)
      show(first && document.getElementById(first) ? first : (riddle.film ? 's-story' : 's-intro'))
    }
    boot()
  </script>
</body>
</html>
