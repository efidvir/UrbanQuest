    /* Art animations: each animated part pivots on the origin of its parent group */
    .anim { transform-origin: 0 0; }
    @media (prefers-reduced-motion: no-preference) {

    const parseRoute = (text) => {
      const out = []
      for (const tok of String(text).split(/[\s,]+/).filter(Boolean)) {
        const m = tok.toUpperCase().match(/^(~?)(FR|FL|BR|BL|F|B|L|R)(\d*)$/)
        if (!m) throw new Error(`Unknown move "${tok}" in the route`)
        const [dx, dy] = MOVES[m[2]]
        const times = Math.max(1, Math.min(20, parseInt(m[3] || '1', 10)))
        for (let i = 0; i < times; i++) out.push({dx, dy, ink: m[1] !== '~'})

      if (!out.length) throw new Error('The route is empty')
      return out

        return `sharp-${side}`

    // Top view of the lawn: the grid of grass squares, the flower beds and the starting point.
    const mapArt = () => {
      const {cols = 3, rows = 4, x = 1, y = rows} = (riddle.start && riddle.start.map) || {}
      const sq = 46
      const gap = 8
      const W = cols * sq + (cols + 1) * gap
      const H = rows * sq + (rows + 1) * gap
      const x0 = (360 - W) / 2
      const y0 = 76
      const bedsY = y0 + H + 6
      const vbH = bedsY + 26 + 32
      const px = x0 + gap / 2 + x * (sq + gap)
      const py = y0 + gap / 2 + (rows - y) * (sq + gap)
      let squares = ''
      for (let i = 0; i < cols; i++) {
        for (let j = 0; j < rows; j++) {
          squares += `<rect x="${x0 + gap + i * (sq + gap)}" y="${y0 + gap + j * (sq + gap)}" width="${sq}" height="${sq}" rx="3" fill="#3d8b4e"/>`
        }
      }
      const flowers = Array.from({length: 13}, (_, k) =>
        `<circle cx="${(x0 + 10 + k * (W - 20) / 12).toFixed(1)}" cy="${bedsY + 13 + (k % 2 ? -4 : 4)}" r="3.2" fill="${['#ff7aa8', '#ffd166', '#ff9f6b', '#f3f0ff'][k % 4]}"/>`).join('')

      return `

      const line = get(riddle, `diary.${lang}`)?.[i]
      return `
        <div class="turn">${turnIcon(turn)}<div><strong>${esc(t(`turn.${turn}`))}</strong><span>${esc(suffix)}</span></div></div>

    }

    const roomText = () => {
      let x = 0, y = 0, minX = 0, maxX = 0, minY = 0, maxY = 0
      for (const m of ROUTE) {
        x += m.dx
        y += m.dy
        minX = Math.min(minX, x)
        maxX = Math.max(maxX, x)
        minY = Math.min(minY, y)
        maxY = Math.max(maxY, y)
      }
      const m = (squares) => +(squares * CELL).toFixed(1)
      const parts = []
      if (maxY) parts.push(t('ahead', {m: m(maxY)}))
      if (minY) parts.push(t('behind', {m: m(-minY)}))
      if (minX) parts.push(t('left', {m: m(-minX)}))
      if (maxX) parts.push(t('right', {m: m(maxX)}))
      return parts.join(', ')
    }

    // ---------- Progress, so a reload doesn't lose the walk ----------
    const PKEY = `urbanquest-riddle-${RIDDLE_ID}`
    const saveProgress = () => store.set(PKEY, JSON.stringify({seg, mode, cell: cellKnown ? CELL : null, key: gotKey}))
    const loadProgress = () => safe(() => JSON.parse(store.get(PKEY) || 'null'))
    const clearProgress = () => store.del(PKEY)

    let wakeLock = null
    const keepAwake = async () => { try { wakeLock = await navigator.wakeLock?.request('screen') } catch { wakeLock = null } }
    const letSleep = () => { try { wakeLock?.release() } catch {} wakeLock = null }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && walkingNow()) keepAwake()
    })

    const isPhone = () => matchMedia('(pointer: coarse)').matches

    const prepareStart = () => {
      const saved = loadProgress()
      const resume = $('#btn-resume')
      if (saved && saved.seg > 0 && saved.seg < N) {
        resume.hidden = false
        resume.textContent = t('resume', {n: saved.seg + 1})
      } else {
        resume.hidden = true
      }
      // Fetch the AR engine in the background, so the camera starts faster.
      if (isPhone()) loadEngine().catch(() => {})
    }

    const render = () => {
      const he = lang === 'he'
      document.documentElement.lang = lang
      document.documentElement.dir = he ? 'rtl' : 'ltr'
      document.title = `${L(riddle.title)} · ${L(riddle.kicker)}`
      $('#lang').textContent = t('langName')
      $('#story').innerHTML = (get(riddle, `story.${lang}`) || []).map((p) => `<p>${esc(p)}</p>`).join('')
      $('#rules').innerHTML = (get(riddle, `rules.${lang}`) || []).map((r) => `<li>${esc(r)}</li>`).join('')
      $('#start-note').hidden = !(riddle.start && riddle.start.placeholder)
      $('#ar-sub').textContent = isPhone() ? t('startARsub') : t('arPhoneOnly')
      const room = $('#room')
      room.hidden = !params.has('cell')
      room.textContent = t('room', {room: roomText()})
      $('#diary-list').innerHTML = TURNS.map((turn, i) => `
        <li><span class="n">${i + 1}</span>${turnIcon(turn)}<span class="hand">${esc(get(riddle, `diary.${lang}`)?.[i] || t(`turn.${turn}`))}</span></li>`).join('')
      document.querySelectorAll('.to-tq').forEach((a) => { a.href = tqUrl() })
      $('#to-tq-sub').textContent = TYPE === 'key' || TYPE === 'console' ? t('backToTQword') : t('backToTQsub')
      document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t) })
      document.querySelectorAll('[data-l]').forEach((el) => { el.textContent = L(get(riddle, el.dataset.l)) })
      if (TYPE === 'key') $('#btn-play').textContent = t('startAR')
      if (TYPE === 'console') $('#btn-play').textContent = t('openConsole')
      storyLabel()
      if (riddle.film) storyCaption()
      document.querySelectorAll('.replay').forEach((b) => b.setAttribute('aria-label', t('playAgain')))
      $('#kv-prev').setAttribute('aria-label', t('prevTree'))
      $('#kv-next').setAttribute('aria-label', t('nextTree'))
      if (TYPE === 'clue') $('#clue-img').alt = L(get(riddle, 'clue.title'))
      if ($('#s-start').classList.contains('on')) prepareStart()
      if ($('#s-walk').classList.contains('on')) renderDiaryPage(false)
      if ($('#s-compass').classList.contains('on')) renderCompass()
      if (document.body.classList.contains('keymode')) renderKey()
      if (document.body.classList.contains('consolemode')) renderConsole()
      if (!$('#cv-sheet').hidden) $('#cv-paper').innerHTML = sheetHtml()
    }
    $('#lang').addEventListener('click', () => {
      lang = lang === 'he' ? 'en' : 'he'
      store.set('urbanquest-lang', lang)
      render()
    })

    // ---------- Shared walk state ----------
    let mode = null      // 'ar' | 'compass' | 'diary'
    let seg = 0          // the stretch being walked now (0-based)
    let gotKey = false
    let diaryState = 'ready'
    let usedDiary = false
    const walkingNow = () => (mode === 'diary' && $('#s-walk').classList.contains('on'))
      || (mode === 'compass' && $('#s-compass').classList.contains('on'))
      || document.body.classList.contains('ar')

    const finish = () => {
      clearProgress()
      letSleep()
      stopCompass()
      mode = null
      // The full diary spells out the route, so it's only offered to players who already walked by it.
      $('#btn-read').hidden = !usedDiary
      show('s-end')
    }

    // ---------- Diary pages: the last resort, when neither AR nor the compass works ----------
    const startDiary = (from = 0) => {
      stopCompass()
      usedDiary = true
      mode = 'diary'
      seg = from
      diaryState = 'ready'
      saveProgress()
      keepAwake()
      show('s-walk')
      renderDiaryPage(false)
    }
    const renderDiaryPage = (animate = true) => {
      const pageEl = $('#w-page')
      const ready = diaryState === 'ready'
      $('#w-progress').textContent = ready ? '' : t('page', {n: seg + 1, total: N})
      $('#w-bar').style.width = `${(seg / N) * 100}%`
      pageEl.innerHTML = ready
        ? `<div class="ready-title">${esc(t('readyTitle'))}</div><p>${esc(seg > 0 ? t('readyResume') : t('readyText'))}</p>${peekArt()}`
        : pageHtml(seg) + peekArt()
      $('#w-next').textContent = ready ? t('imThere') : t('atCrossing')
      $('#w-prev').hidden = ready || seg === 0
      if (animate) {
        pageEl.classList.remove('flip')
        void pageEl.offsetWidth
        pageEl.classList.add('flip')
      }
    }
    $('#w-next').addEventListener('click', () => {
      if (diaryState === 'ready') {
        diaryState = 'walking'
      } else {
        seg++
        if (navigator.vibrate) navigator.vibrate(30)
        if (seg >= N) return finish()
        saveProgress()
      }
      renderDiaryPage()
    })
    $('#w-prev').addEventListener('click', () => {
      if (seg > 0) seg--
      saveProgress()
      renderDiaryPage()
    })
    $('#w-exit').addEventListener('click', () => {
      letSleep()
      show('s-start')
    })

    $('#btn-ar').addEventListener('click', () => startAR(0))
    $('#btn-resume').addEventListener('click', () => {
      const saved = loadProgress() || {}
      const from = Math.max(0, Math.min(N - 1, saved.seg || 0))
      if (saved.mode === 'diary') startDiary(from)
      else if (saved.mode === 'compass') startCompass(from)
      else startAR(from)
    })
    $('#btn-again').addEventListener('click', () => {
      clearProgress()
      show('s-start')
    })

    // ---------- Back to TravelQuest ----------
    // Logins there are per site, so go back to whichever TravelQuest site the player came from.
    const TQ_HOST = /(^|\.)(travelandquest\.com|travelquest\.xyz)$/i
    const fromTQ = safe(() => {
      const ref = document.referrer ? new URL(document.referrer) : null
      if (ref && TQ_HOST.test(ref.hostname)) {
        session.set('urbanquest-tq-origin', ref.origin)
        return true
      }
      return false
    }, false)
    const tqUrl = () => {
      const tq = (riddle && riddle.travelQuest) || {}
      const origin = session.get('urbanquest-tq-origin') || tq.origin || 'https://travelandquest.com'
      return origin + ((tq.path && tq.path[lang]) || (lang === 'he' ? '/iw/' : '/en/'))
    }
    document.querySelectorAll('.to-tq').forEach((a) => a.addEventListener('click', (e) => {
      e.preventDefault()
      stopKey()
      if (fromTQ && history.length > 1) {
        history.back()   // opened from TravelQuest in this tab: step back to the mission
        return
      }
      window.close()     // opened in a new tab: closing it shows TravelQuest again
      setTimeout(() => { location.href = tqUrl() }, 350)
    }))

    // ---------- AR: Udi, Mitzi and glowing footprints on the real ground (8th Wall SLAM) ----------
    let THREE = null
    let enginePromise = null
    let pipelineAdded = false
    let scene, camera
    let state = 'off'            // off | loading | ready | intro | walking | lost | outro | failed
    let trackingSeen = false
    let limitedSince = 0
    let fwd, right, UP
    let segStart = null
    let segEnd = null
    let segDir = null
    let segLen = 0
    let lastPos = null
    let lastFrame = 0
    let calibrating = false      // the first stretch measures how big the squares really are
    let auto = false             // advance by itself when the player reaches the next crossing
    let prints = []              // footprints of the stretch being walked
    let fading = []              // footprints already walked: {meshes, born}
    let ring = null
    let props = []               // things Udi left on the paths
    let sprites = null           // the drawings, as textures
    let mitzi = null
    let udi = null
    let footGeometry = null
    let talk = null              // speech bubble or diary note showing now
    let actScale = 1             // Udi and Mitzi are life size in the garden, smaller at home
    const GOLD = 0xFFB300
    const WHITE = 0xFFFFFF

    const loadScript = (src, attrs = {}) => new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = src
      s.crossOrigin = 'anonymous'
      for (const [k, v] of Object.entries(attrs)) s.setAttribute(k, v)
      s.onload = resolve
      s.onerror = () => reject(new Error(`Couldn't load ${src}`))
      document.head.appendChild(s)
    })
    const loadEngine = () => {
      enginePromise = enginePromise || (async () => {
        const three = await import('three')
        window.THREE = three  // the 8th Wall three.js module reads window.THREE
        await loadScript(ENGINE.extras)
        await loadScript(ENGINE.landing)
        const loaded = new Promise((resolve) => {
          if (window.XR8) resolve()
          else window.addEventListener('xrloaded', resolve, {once: true})
        })
        await loadScript(ENGINE.xr, {'data-preload-chunks': 'slam'})
        await loaded
        return three
      })()
      enginePromise.catch(() => { enginePromise = null })  // allow a retry later
      return enginePromise
    }

    // The drawings become flat cut-outs standing on the ground. vb = the drawing's viewBox, h = height in metres.
    const SPRITE = {
      mitziSit: {vb: '-30 -58 76 62', h: 0.45, art: () => mitziSitting(false, false)},
      mitziWalkA: {vb: '-36 -52 72 54', h: 0.39, art: () => mitziWalk(0)},
      mitziWalkB: {vb: '-36 -52 72 54', h: 0.39, art: () => mitziWalk(1)},
      udiWaveA: {vb: '-76 -182 152 186', h: 1.71, art: () => udiWave(-150)},
      udiWaveB: {vb: '-76 -182 152 186', h: 1.71, art: () => udiWave(-122)},
      udiRead: {vb: '-76 -182 152 186', h: 1.71, art: () => udiReading(false)},
      key: {vb: '-30 -14 60 28', h: 0.13, art: keyArt},
      cup: {vb: '-16 -38 38 42', h: 0.15, art: cupArt},
    }
    const spriteSvg = ({vb, art}) => {
      const [, , w, h] = vb.split(' ').map(Number)
      const k = 512 / Math.max(w, h)
      return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(w * k)}" height="${Math.round(h * k)}" viewBox="${vb}">${art()}</svg>`
    }
    const loadTexture = (src, aspect = null) => new Promise((resolve) => {
      const img = new Image()
      img.onload = () => {
        try {
          const c = document.createElement('canvas')
          c.width = img.naturalWidth
          c.height = img.naturalHeight
          const g = c.getContext('2d')
          g.drawImage(img, 0, 0)
          g.getImageData(0, 0, 1, 1)  // throws if this browser won't let a picture become a texture
          const tx = new THREE.CanvasTexture(c)
          tx.colorSpace = THREE.SRGBColorSpace
          resolve({tex: tx, aspect: aspect || c.width / c.height})
        } catch {
          resolve(null)
        }
      }
      img.onerror = () => resolve(null)
      img.src = src
    })
    // Picture files named in the riddle's "art" list (transparent PNGs, feet at the bottom edge).
    const ART_FOR = {mitziSit: 'mitziSit', mitziWalkA: 'mitziWalk', mitziWalkB: 'mitziWalk', udiWaveA: 'udiWave', udiWaveB: 'udiWave', udiRead: 'udiRead', key: 'key', cup: 'cup'}
    const artFile = (name) => get(riddle, `art.${ART_FOR[name] || name}`)
    const loadSprites = async () => {
      if (sprites) return
      const out = {}
      await Promise.all(Object.keys(SPRITE).map(async (k) => {
        const file = artFile(k)
        const [, , w, h] = SPRITE[k].vb.split(' ').map(Number)
        out[k] = (file && await loadTexture(file)) ||
          await loadTexture(`data:image/svg+xml;charset=utf-8,${encodeURIComponent(spriteSvg(SPRITE[k]))}`, w / h)
      }))
      sprites = out
    }

    // A cut-out standing on the ground, with a soft shadow. It turns to face the camera each frame.
    const standee = (name, scale) => {
      const spec = SPRITE[name]
      const [, , w, h] = spec.vb.split(' ').map(Number)
      const height = spec.h * scale
      const group = new THREE.Group()
      const shadow = new THREE.Mesh(
        new THREE.CircleGeometry(height * (name.startsWith('udi') ? 0.13 : 0.3), 24),
        new THREE.MeshBasicMaterial({color: 0x000000, transparent: true, opacity: 0.18, depthWrite: false}))
      shadow.rotation.x = -Math.PI / 2
      shadow.position.y = 0.003
      group.add(shadow)
      let card
      if (sprites && sprites[name]) {
        const geo = new THREE.PlaneGeometry(height * (sprites[name].aspect || w / h), height)
        geo.translate(0, height / 2, 0)
        card = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({map: sprites[name].tex, transparent: true, alphaTest: 0.04, side: THREE.DoubleSide, depthWrite: false}))
      } else {
        // The drawing didn't load on this phone: a glowing marker stands in for it.
        card = new THREE.Mesh(new THREE.SphereGeometry(height * 0.3, 16, 12), new THREE.MeshBasicMaterial({color: GOLD, transparent: true}))
        card.position.y = height * 0.3
      }
      card.renderOrder = 3
      group.add(card)
      group.userData = {card, shadow, name, height}
      return group
    }
    const setPicture = (st, name) => {
      if (st.userData.name === name || !sprites || !sprites[name]) return
      st.userData.card.material.map = sprites[name].tex
      st.userData.name = name
    }
    const faceCamera = (st, at = st.position) => {
      st.userData.card.rotation.y = Math.atan2(camera.position.x - at.x, camera.position.z - at.z)
    }
    const setOpacity = (st, o) => {
      st.userData.card.material.opacity = o
      st.userData.shadow.material.opacity = 0.18 * o
    }

    const groundPos = () => new THREE.Vector3(camera.position.x, 0, camera.position.z)
    const facing = () => {
      const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)
      f.y = 0
      if (f.lengthSq() < 1e-6) f.set(0, 0, -1)
      return f.normalize()
    }
    const aimAxes = () => {
      fwd = facing()
      right = new THREE.Vector3().crossVectors(fwd, UP).normalize()
    }
    const sideOf = (dir) => new THREE.Vector3(-dir.z, 0, dir.x)

    const buildThree = () => {
      UP = new THREE.Vector3(0, 1, 0)
      fwd = new THREE.Vector3(0, 0, -1)
      right = new THREE.Vector3(1, 0, 0)
      // A shoe print: sole and heel, lying flat with the toe pointing along -Z.
      const sole = new THREE.Shape()
      sole.absellipse(0, 0.1, 0.042, 0.08, 0, Math.PI * 2, false, 0)
      const heel = new THREE.Shape()
      heel.absellipse(0, -0.035, 0.034, 0.042, 0, Math.PI * 2, false, 0)
      footGeometry = new THREE.ShapeGeometry([sole, heel], 12)
      footGeometry.rotateX(-Math.PI / 2)
    }

    const flatRing = (pos, inner, outer, color) => {
      const m = new THREE.Mesh(
        new THREE.RingGeometry(inner, outer, 48),
        new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.9, side: THREE.DoubleSide, depthWrite: false})
      )
      m.rotation.x = -Math.PI / 2
      m.position.set(pos.x, 0.012, pos.z)
      return m
    }

    // ---------- Footprints ----------
    const footScale = () => Math.max(0.45, Math.min(1, CELL / 1.5))
    const layPrints = (from, dir, len, ink) => {
      const s = footScale()
      const n = Math.max(2, Math.round(len / (0.34 * s)))
      const side = sideOf(dir)
      const out = []
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(footGeometry, new THREE.MeshBasicMaterial({color: ink ? GOLD : WHITE, transparent: true, opacity: 0, depthWrite: false}))
        m.position.copy(from).addScaledVector(dir, ((i + 0.5) * len) / n).addScaledVector(side, (i % 2 ? 1 : -1) * 0.065 * s)
        m.position.y = 0.006
        m.rotation.y = Math.atan2(-dir.x, -dir.z)
        m.scale.setScalar(s)
        m.userData.i = i
        m.userData.tail = 1
        scene.add(m)
        out.push(m)
      }
      return out
    }
    const animatePrints = (tt, now) => {
      // The stretch to walk: prints light up one after another, as if someone walks it just ahead of you.
      for (const p of prints) {
        const wave = Math.max(0, Math.sin(tt * 3.2 - p.userData.i * 0.55))
        p.material.opacity = (0.22 + 0.78 * wave) * p.userData.tail
      }
      // Walked stretches glow, then fade: the picture only lives in the player's head.
      fading = fading.filter((f) => {
        const k = KEEP_TRAIL ? 0 : (now - f.born) / FADE_MS
        if (k >= 1) {
          f.meshes.forEach((m) => scene.remove(m))
          return false
        }
        f.meshes.forEach((m) => { m.material.opacity = 0.9 * (1 - k) * m.userData.tail })
        return true
      })
      if (ring) ring.material.opacity = 0.55 + 0.35 * Math.sin(tt * 4)
    }
    const clearStretch = () => {
      for (const p of prints) scene.remove(p)
      prints = []
      if (ring) scene.remove(ring)
      ring = null
    }
    const dropLastFading = () => {
      const last = fading.pop()
      if (last) last.meshes.forEach((m) => scene.remove(m))
    }
    const dropAllFading = () => {
      fading.forEach((f) => f.meshes.forEach((m) => scene.remove(m)))
      fading = []
    }

    // ---------- Mitzi: runs ahead to the next crossing and waits there ----------
    const makeMitzi = (pos) => {
      const sit = standee('mitziSit', actScale)
      const walk = standee('mitziWalkA', actScale)
      walk.visible = false
      const group = new THREE.Group()
      group.add(sit, walk)
      group.position.copy(pos)
      scene.add(group)
      return {group, sit, walk, mode: 'sit', from: null, to: null, t0: 0, dur: 0, heading: new THREE.Vector3(1, 0, 0)}
    }
    const mitziSpeed = () => Math.max(1, Math.min(3, CELL * 0.8))
    const mitziRunTo = (point) => {
      mitzi.from = mitzi.group.position.clone()
      mitzi.to = point.clone()
      mitzi.t0 = performance.now()
      mitzi.dur = Math.max(450, (mitzi.from.distanceTo(point) / mitziSpeed()) * 1000)
      mitzi.mode = 'run'
    }
    const mitziHead = () => (mitzi ? mitzi.group.position.clone().add(new THREE.Vector3(0, 0.55 * actScale, 0)) : null)
    const updateMitzi = (now, dt) => {
      if (!mitzi) return
      let moving = false
      const pos = mitzi.group.position
      if (mitzi.mode === 'run') {
        const k = Math.min(1, (now - mitzi.t0) / mitzi.dur)
        const e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2
        pos.lerpVectors(mitzi.from, mitzi.to, e)
        mitzi.heading.subVectors(mitzi.to, mitzi.from)
        moving = k < 1
        if (!moving) mitzi.mode = 'sit'
      } else if (mitzi.mode === 'follow') {
        // First stretch, while the size of the squares is still unknown: lead the player a step or two ahead.
        const done = Math.max(0, groundPos().sub(segStart).dot(segDir))
        const target = segStart.clone().addScaledVector(segDir, Math.min(done + 1.4 * actScale, segLen * 1.5))
        const gap = target.sub(pos)
        gap.y = 0
        const d = gap.length()
        if (d > 0.08) {
          pos.addScaledVector(gap.normalize(), Math.min(d, mitziSpeed() * dt))
          mitzi.heading.copy(gap)
          moving = true
        }
      }
      mitzi.sit.visible = !moving
      mitzi.walk.visible = moving
      if (moving) {
        setPicture(mitzi.walk, Math.floor(now / 130) % 2 ? 'mitziWalkA' : 'mitziWalkB')
        mitzi.walk.userData.card.position.y = Math.abs(Math.sin((now / 130) * Math.PI)) * 0.025 * actScale
        mitzi.walk.userData.card.rotation.z = Math.sin((now / 130) * Math.PI) * 0.05
        const camRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion)
        mitzi.walk.userData.card.scale.x = mitzi.heading.dot(camRight) < 0 ? -1 : 1
      } else {
        mitzi.sit.userData.card.scale.y = 1 + Math.sin(now / 600) * 0.015
      }
      faceCamera(mitzi.sit, pos)
      faceCamera(mitzi.walk, pos)
    }

    // ---------- Udi: greets the player at the start, and asks what he wrote at the end ----------
    const hideUdi = () => {
      if (udi) scene.remove(udi)
      udi = null
    }
    const showUdi = (pos, pose) => {
      hideUdi()
      udi = standee(pose === 'read' ? 'udiRead' : 'udiWaveA', actScale)
      udi.position.copy(pos)
      udi.userData.pose = pose
      udi.userData.born = performance.now()
      setOpacity(udi, 0)
      scene.add(udi)
    }
    const udiDistance = () => 2.4 * actScale + 0.5
    const udiHeadPos = () => (udi ? udi.position.clone().add(new THREE.Vector3(0, 1.8 * actScale, 0)) : null)
    const updateUdi = (now) => {
      if (!udi) return
      if (udi.userData.leaving) {
        const k = Math.min(1, (now - udi.userData.leaving) / 600)
        setOpacity(udi, 1 - k)
        if (k >= 1) hideUdi()
        return
      }
      setOpacity(udi, Math.min(1, (now - udi.userData.born) / 500))
      if (udi.userData.pose === 'wave') setPicture(udi, Math.floor(now / 380) % 2 ? 'udiWaveA' : 'udiWaveB')
      udi.userData.card.rotation.z = Math.sin(now / 420) * 0.025
      faceCamera(udi)
    }

    // ---------- Things Udi left on the paths: the empty coffee cup, the dropped keys ----------
    const placeProps = () => {
      for (const p of get(riddle, 'ar.props') || []) {
        if (p.page !== seg + 1 || !SPRITE[p.item]) continue
        const st = standee(p.item, actScale)
        st.position.copy(segEnd)
        st.userData.page = p.page
        st.userData.collect = !!p.collect
        st.userData.item = p.item
        scene.add(st)
        props.push(st)
      }
    }
    const collectProps = (page) => {
      props = props.filter((st) => {
        if (!st.userData.collect || st.userData.page !== page) return true
        scene.remove(st)
        if (st.userData.item === 'key') gotKey = true
        if (navigator.vibrate) navigator.vibrate([30, 40, 30])
        return false
      })
    }
    const clearProps = () => {
      props.forEach((st) => scene.remove(st))
      props = []
    }
    const updateProps = (tt) => {
      for (const st of props) {
        if (st.userData.collect) st.userData.card.position.y = (0.2 + Math.sin(tt * 2.6) * 0.05) * actScale
        faceCamera(st)
      }
    }

    // ---------- Speech bubbles and diary notes, pinned to a point in the camera view ----------
    const bubbleEl = $('#ar-bubble')
    const readMs = (s) => Math.min(9000, 1700 + s.length * 60)
    const hideBubble = () => {
      talk = null
      bubbleEl.classList.remove('on')
    }
    const showTalk = (lines, anchor, done, kind) => {
      if (!lines || !lines.length) {
        if (done) done()
        return
      }
      talk = {lines, i: 0, anchor, done, kind, until: performance.now() + readMs(lines[0])}
      bubbleEl.className = kind === 'note' ? 'note on' : 'on'
      bubbleEl.textContent = lines[0]
      placeBubble()
    }
    const say = (lines, anchor, done) => showTalk(lines, anchor, done, 'say')
    const note = (line, anchor) => showTalk([line], anchor, null, 'note')
    const nextLine = () => {
      if (!talk) return
      talk.i++
      if (talk.i >= talk.lines.length) {
        const done = talk.done
        hideBubble()
        if (done) done()
        return
      }
      talk.until = performance.now() + readMs(talk.lines[talk.i])
      bubbleEl.textContent = talk.lines[talk.i]
    }
    bubbleEl.addEventListener('click', nextLine)
    const placeBubble = () => {
      if (!talk || !camera) return
      const p = talk.anchor && talk.anchor()
      const w = innerWidth
      const h = innerHeight
      let x = w / 2
      let y = h * 0.32
      if (p) {
        const v = p.project(camera)
        if (v.z < 1) {
          x = ((v.x + 1) / 2) * w
          y = ((1 - v.y) / 2) * h
        }
      }
      x = Math.min(w - 100, Math.max(100, x))
      y = Math.min(h - 210, Math.max(120, y))
      bubbleEl.style.transform = `translate(${x.toFixed(0)}px, ${y.toFixed(0)}px) translate(-50%, -100%)`
    }

    // ---------- The few words on top of the camera view ----------
    let panelAction = null
    const panel = (html, label = null, action = null) => {
      $('#ar-panel').hidden = false
      $('#ar-panel-text').innerHTML = html
      const btn = $('#ar-panel-btn')
      btn.hidden = !label
      btn.textContent = label || ''
      panelAction = action
    }
    const hidePanel = () => {
      $('#ar-panel').hidden = true
      panelAction = null
    }
    $('#ar-panel-btn').addEventListener('click', () => { if (panelAction) panelAction() })
    const setHere = (on) => {
      $('#ar-here').hidden = !on
      $('#ar-here-icon').innerHTML = PAW
      $('#ar-here-label').textContent = calibrating ? t('atFirstCrossing') : t('atCrossing')
      $('#ar-here').classList.toggle('pulse', calibrating)
    }
    $('#ar-here').addEventListener('click', () => completeStretch(true))
    const updateCount = () => {
      $('#ar-count').innerHTML = `${PAW}${state === 'intro' ? '' : `${Math.min(seg + 1, N)} / ${N}`}`
      $('#ar-key').hidden = !gotKey
      $('#ar-key').innerHTML = KEY_ICON
    }
    const setStatus = (text, good) => {
      $('#ar-dot').classList.toggle('good', !!good)
      $('#ar-status').hidden = !text
      $('#ar-status').textContent = text || ''
    }

    const hasIntro = () => (get(riddle, `ar.intro.${lang}`) || []).length > 0
    const readyPanel = () => {
      if (!trackingSeen) return panel(`${PHONE_TILT}<p>${esc(t('pointGround'))}</p>`)
      panel(`<p>${esc(seg > 0 ? t('arResume') : t('arReady'))}</p>`, t('go'), () => (seg === 0 && hasIntro() ? startIntro() : beginWalk(true)))
    }
    const lostPanel = () => panel(`<p>${esc(t('lost'))}</p>`, t('cont'), continueAfterLost)
    // If AR can't start, the compass comes next; the written diary is only the last resort.
    const failedPanel = () => panel(`<p>${esc(t('arFail'))}</p>`, t('useCompass'), () => {
      stopAR()
      startCompass(seg)
    })

    // ---------- The walk, step by step ----------
    const startAR = async (from = 0) => {
      mode = 'ar'
      seg = from
      const saved = loadProgress()
      gotKey = !!(from > 0 && saved && saved.key)
      if (from > 0 && saved && saved.cell && !params.has('cell')) {
        CELL = saved.cell
        cellKnown = true
      }
      calibrating = !cellKnown && !!get(riddle, 'ar.calibrate')
      auto = params.has('auto') ? params.get('auto') === '1' : cellKnown
      saveProgress()
      document.body.classList.add('ar')
      state = 'loading'
      trackingSeen = false
      limitedSince = 0
      setStatus('', false)
      setHere(false)
      updateCount()
      panel(`<p>${esc(t('loadingAR'))}</p>`)
      keepAwake()
      try {
        THREE = await loadEngine()
        await loadSprites()
      } catch {
        state = 'failed'
        failedPanel()
        return
      }
      if (!document.body.classList.contains('ar')) return  // they left while it loaded
      if (!footGeometry) buildThree()
      actScale = Math.max(0.5, Math.min(1, CELL / 2))
      if (!pipelineAdded) {
        XR8.XrController.configure({scale: SCALE})
        XR8.addCameraPipelineModules([
          XR8.GlTextureRenderer.pipelineModule(),      // draws the camera feed
          XR8.Threejs.pipelineModule(),                // three.js scene synced to the camera
          XR8.XrController.pipelineModule(),           // SLAM world tracking
          LandingPage.pipelineModule(),                // desktop: shows a QR code to open on a phone
          XRExtras.FullWindowCanvas.pipelineModule(),  // full-screen canvas
          XRExtras.Loading.pipelineModule(),           // loading screen + camera/motion permission prompts
          XRExtras.RuntimeError.pipelineModule(),      // error screen
          walkModule(),
        ])
        pipelineAdded = true
      }
      XR8.run({canvas: $('#camerafeed')})
    }

    const clearScene = () => {
      if (!scene) return
      clearStretch()
      dropAllFading()
      clearProps()
      if (mitzi) scene.remove(mitzi.group)
      mitzi = null
      hideUdi()
      hideBubble()
    }

    const stopAR = () => {
      clearScene()
      safe(() => window.XR8 && XR8.stop())
      document.body.classList.remove('ar')
      document.documentElement.removeAttribute('style')
      document.body.removeAttribute('style')
      state = 'off'
      hidePanel()
      letSleep()
    }
    $('#ar-exit').addEventListener('click', () => {
      stopAR()
      mode = null
      show('s-start')
    })

    // Udi waits at the start, waves, and tells the player what to do; then Mitzi takes over.
    const startIntro = () => {
      state = 'intro'
      clearScene()
      aimAxes()
      hidePanel()
      setHere(false)
      updateCount()
      const pos = groundPos().addScaledVector(fwd, udiDistance())
      showUdi(pos, 'wave')
      mitzi = makeMitzi(pos.clone().addScaledVector(right, 0.6 * actScale))
      say(get(riddle, `ar.intro.${lang}`), udiHeadPos, () => {
        if (udi) udi.userData.leaving = performance.now()
        beginWalk(false)
      })
    }

    const beginWalk = (reaim) => {
      if (reaim) {
        clearScene()
        aimAxes()
      }
      state = 'walking'
      hidePanel()
      const here = groundPos()
      lastPos = here
      startStretch(here)
    }

    const startStretch = (start) => {
      clearStretch()
      const move = ROUTE[seg]
      const dir = new THREE.Vector3().addScaledVector(right, move.dx).addScaledVector(fwd, move.dy)
      const len = dir.length() * CELL
      dir.normalize()
      segStart = start.clone()
      segDir = dir
      segLen = len
      segEnd = start.clone().addScaledVector(dir, len)
      if (TURNS[seg] === 'back') dropLastFading()   // walking straight back: clear the old prints at once
      prints = layPrints(start, dir, calibrating ? len * 1.5 : len, move.ink)
      if (calibrating) {
        // The real length isn't known yet, so the prints just fade out ahead of the player.
        prints.forEach((p) => { p.userData.tail = Math.min(1, (prints.length - p.userData.i) / (prints.length * 0.4)) })
      } else {
        const s = footScale()
        ring = flatRing(segEnd, 0.2 * s, 0.29 * s, move.ink ? GOLD : WHITE)
        scene.add(ring)
      }
      if (!mitzi) mitzi = makeMitzi(start.clone().addScaledVector(dir, 0.6 * actScale))
      if (calibrating) mitzi.mode = 'follow'
      else mitziRunTo(segEnd)
      placeProps()
      updateCount()
      setHere(true)
      // No written directions in AR: Mitzi and the footprints are the only guide.
    }

    // byTap: the player says they're at the crossing, so the next stretch starts at their feet
    // (tracking drift never builds up). Otherwise they came within reach of it, and it starts at the crossing itself.
    const completeStretch = (byTap) => {
      if (state !== 'walking') return
      const here = groundPos()
      if (calibrating) {
        // Every stretch is one side of a square, so the first one tells us how big the squares are.
        const walked = here.distanceTo(segStart)
        if (walked >= 0.8 && walked <= 9) CELL = walked
        cellKnown = true
        calibrating = false
        auto = params.has('auto') ? params.get('auto') === '1' : true
      }
      const anchor = byTap ? here : segEnd.clone()
      fading.push({meshes: prints, born: performance.now()})
      prints = []
      collectProps(seg + 1)
      seg++
      if (navigator.vibrate) navigator.vibrate(40)
      if (seg >= N) return startOutro()
      saveProgress()
      startStretch(anchor)
      lastPos = here
    }

    const enterLost = () => {
      state = 'lost'
      clearStretch()
      setHere(false)
      if (talk && talk.kind === 'note') hideBubble()
      lostPanel()
    }

    const continueAfterLost = () => {
      // Everything placed so far belongs to the old, slipped frame.
      dropAllFading()
      collectProps(seg + 1)
      clearProps()
      aimAxes()
      seg++
      limitedSince = 0
      const here = groundPos()
      lastPos = here
      if (mitzi) mitzi.group.position.copy(here).addScaledVector(right, 0.5 * actScale)
      if (seg >= N) return startOutro()
      saveProgress()
      state = 'walking'
      hidePanel()
      startStretch(here)
    }

    // At the last crossing Udi is back, reading his diary: "so... what did I write?"
    const startOutro = () => {
      state = 'outro'
      clearStretch()
      clearProps()
      setHere(false)
      hideBubble()
      clearProgress()
      updateCount()
      const f = facing()
      const pos = groundPos().addScaledVector(f, udiDistance())
      showUdi(pos, 'read')
      if (mitzi) mitziRunTo(pos.clone().addScaledVector(sideOf(f), 0.6 * actScale))
      say(get(riddle, `ar.outro.${lang}`), udiHeadPos, finishAr)
    }

    const finishAr = () => {
      stopAR()
      finish()
    }

    // Our camera pipeline module
    const walkModule = () => ({
      name: 'udis-garden-walk',

      onStart: ({canvas}) => {
        const xr = XR8.Threejs.xrScene()
        scene = xr.scene
        camera = xr.camera
        camera.position.set(0, CAMERA_HEIGHT, 0)
        XR8.XrController.updateCameraProjectionMatrix({origin: camera.position, facing: camera.quaternion})
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false})
        state = 'ready'
        lastFrame = performance.now()
        setStatus(t('stMove'), false)
        readyPanel()
        // Safety net: if no tracking event arrives, still let the player start after a few seconds.
        setTimeout(() => {
          if (trackingSeen) return
          trackingSeen = true
          if (state === 'ready') readyPanel()
        }, 5000)
      },

      onUpdate: () => {
        if (!scene) return
        const now = performance.now()
        const dt = Math.min(0.05, (now - lastFrame) / 1000)
        lastFrame = now
        const tt = now / 1000
        animatePrints(tt, now)
        updateMitzi(now, dt)
        updateUdi(now)
        updateProps(tt)
        if (talk && now > talk.until) nextLine()
        placeBubble()

        if (state !== 'walking') return
        const here = groundPos()

        // A sudden jump, or weak tracking for a while, means the world origin slipped.
        if (lastPos && here.distanceTo(lastPos) > JUMP) return enterLost()
        if (limitedSince && now - limitedSince > LOST_AFTER_MS) return enterLost()
        lastPos = here

        // Arrived = near the crossing and well along the stretch (so turning straight back can't skip a stretch).
        if (!auto || calibrating) return
        const arrive = Math.min(0.9, Math.max(0.25, 0.35 * segLen))
        const along = here.clone().sub(segStart).dot(segDir)
        if (here.distanceTo(segEnd) < arrive && along > 0.6 * segLen) completeStretch(false)
      },

      listeners: [{
        event: 'reality.trackingstatus',
        process: ({detail}) => {
          const {status, reason} = detail || {}
          if (status === 'NORMAL') {
            limitedSince = 0
            setStatus('', true)
            if (!trackingSeen) {
              trackingSeen = true
              if (state === 'ready') readyPanel()
            }
            return
          }
          if (!limitedSince) limitedSince = performance.now()
          if (reason === 'INITIALIZING') setStatus(t('stInit'), false)
          else if (reason === 'TOO_MUCH_MOTION') setStatus(t('stFast'), false)
          else if (reason === 'NOT_ENOUGH_TEXTURE') setStatus(t('stTexture'), false)
          else setStatus(t('stLimited'), false)
        },
      }],

      onCameraStatusChange: ({status}) => {
        if (status === 'failed') {
          state = 'failed'
          failedPanel()
        }
      },

      onException: (err) => {
        let msg = err && err.message
        if (!msg) msg = safe(() => JSON.stringify(err), String(err))
        showError(`AR error: ${msg}`)
      },
    })

    // ---------- Compass mode: an arrow that turns with the phone, when AR can't start ----------
    // The arrow points along the next stretch. "Forward" is the compass bearing the phone faced when
    // the player said they were at the start facing the far end. No written directions, as in AR.
    const RAD = Math.PI / 180
    let heading = null          // where the back of the phone points, in degrees from north
    let headingSmooth = null
    let farEnd = null           // compass bearing of the far end of the lawn
    let compassState = 'ready'  // ready | walking
    let compassOn = false
    let listening = false
    let aligned = false
    let needleAngle = 0
    let unreliable = false

    // From the phone's orientation angles (W3C DeviceOrientation) to the bearing its back camera faces.
    const headingFromAngles = (a, b, g) => {
      const cA = Math.cos(a * RAD), sA = Math.sin(a * RAD)
      const cB = Math.cos(b * RAD), sB = Math.sin(b * RAD)
      const cG = Math.cos(g * RAD), sG = Math.sin(g * RAD)
      let east = -cA * sG - sA * sB * cG
      let north = -sA * sG + cA * sB * cG
      if (Math.hypot(east, north) < 0.35) {   // lying flat: use the top edge instead
        east = -sA * cB
        north = cA * cB
      }
      return (Math.atan2(east, north) / RAD + 360) % 360
    }
    const onOrientation = (e) => {
      let h = null
      if (typeof e.webkitCompassHeading === 'number' && !Number.isNaN(e.webkitCompassHeading)) {
        h = e.webkitCompassHeading                                   // iPhone
        unreliable = e.webkitCompassAccuracy < 0 || e.webkitCompassAccuracy > 30
      } else if ((e.absolute || e.type === 'deviceorientationabsolute') && e.alpha != null) {
        h = headingFromAngles(e.alpha, e.beta || 0, e.gamma || 0)    // Android
      }
      if (h == null) return
      // Smooth on the circle, so 359° → 1° doesn't swing the long way round.
      if (headingSmooth == null) headingSmooth = {x: Math.sin(h * RAD), y: Math.cos(h * RAD)}
      headingSmooth.x = headingSmooth.x * 0.75 + Math.sin(h * RAD) * 0.25
      headingSmooth.y = headingSmooth.y * 0.75 + Math.cos(h * RAD) * 0.25
      heading = (Math.atan2(headingSmooth.x, headingSmooth.y) / RAD + 360) % 360
    }
    // Must run straight from a tap: iPhones only ask for motion access inside one.
    // Whatever the answer, readings arriving is what counts (checked right after).
    const listenCompass = () => {
      const ask = typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function'
        ? DeviceOrientationEvent.requestPermission().catch(() => 'denied')
        : Promise.resolve('granted')
      return ask.then(() => {
        if (!listening) {
          if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', onOrientation)
          window.addEventListener('deviceorientation', onOrientation)
          listening = true
        }
        return typeof DeviceOrientationEvent !== 'undefined'
      })
    }
    const waitFor = (test, ms) => new Promise((resolve) => {
      const t0 = performance.now()
      const tick = () => (test() ? resolve(true) : performance.now() - t0 > ms ? resolve(false) : setTimeout(tick, 100))
      tick()
    })

    // Checked once at the start: are they in the garden? Phone GPS is only good to a few metres,
    // so it can't tell crossings apart, but it can tell the garden from the street.
    const distanceM = (lat1, lng1, lat2, lng2) => {
      const dLat = (lat2 - lat1) * RAD
      const dLng = (lng2 - lng1) * RAD
      const s = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * RAD) * Math.cos(lat2 * RAD) * Math.sin(dLng / 2) ** 2
      return 6371000 * 2 * Math.atan2(Math.sqrt(s), Math.sqrt(1 - s))
    }
    let gpsChecked = false
    const checkGps = () => {
      const g = get(riddle, 'start.gps')
      if (gpsChecked || !g || !navigator.geolocation) return
      gpsChecked = true
      navigator.geolocation.getCurrentPosition((p) => {
        const d = distanceM(p.coords.latitude, p.coords.longitude, g.lat, g.lng)
        const far = d > (g.radius || 60) + Math.max(15, p.coords.accuracy || 0)
        const el = $('#c-gps')
        el.hidden = false
        el.classList.toggle('far', far)
        el.dataset.m = Math.round(d)
        el.dataset.far = far ? '1' : ''
        el.textContent = far ? t('gpsFar', {m: Math.round(d)}) : `✓ ${t('gpsNear')}`
      }, () => {}, {enableHighAccuracy: true, timeout: 12000, maximumAge: 60000})
    }

    const dialSvg = () => `
      <svg viewBox="-110 -110 220 220">
        <circle r="100" fill="rgba(255,255,255,.05)" stroke="rgba(255,255,255,.18)" stroke-width="2"/>
        ${Array.from({length: 36}, (_, i) => `<line y1="-100" y2="${i % 3 ? -93 : -86}" stroke="rgba(255,255,255,${i % 3 ? .25 : .5})" stroke-width="2" transform="rotate(${i * 10})"/>`).join('')}
        <circle class="glow" r="100" fill="none" stroke="${C.gold}" stroke-width="6"/>
      </svg>
      <svg viewBox="-110 -110 220 220" class="needle" id="c-needle">
        <path class="arrow" d="M0 -86L36 -26H13V64H-13V-26H-36Z" stroke="#1d2550" stroke-width="4" stroke-linejoin="round"/>
      </svg>`
    const catPics = () => {
      const sit = get(riddle, 'art.mitziSit')
      const run = get(riddle, 'art.mitziWalk')
      return (sit ? `<img class="sit" src="${esc(sit)}" alt="">` : `<svg class="sit" viewBox="-30 -58 76 62" style="height:84px;width:auto">${mitziSitting(false, false)}</svg>`)
        + (run ? `<img class="run" src="${esc(run)}" alt="">` : `<svg class="run" viewBox="-36 -52 72 54" style="height:70px;width:auto">${mitziWalk(0)}</svg>`)
    }

    const startCompass = (from = 0) => {
      stopAR()
      mode = 'compass'
      seg = from
      compassState = 'ready'
      aligned = false
      saveProgress()
      $('#c-dial').innerHTML = dialSvg()
      $('#c-trot').innerHTML = catPics()
      $('#c-diary').hidden = true
      show('s-compass')
      renderCompass()
      checkGps()
      compassOn = true
      requestAnimationFrame(tickCompass)
    }
    const stopCompass = () => { compassOn = false }

    const renderCompass = () => {
      const ready = compassState === 'ready'
      $('#c-count').innerHTML = `${PAW}${ready ? '' : `${Math.min(seg + 1, N)} / ${N}`}`
      $('#c-bar').style.width = `${(seg / N) * 100}%`
      $('#c-next').textContent = ready ? t('facingFarEnd') : t('atCrossing')
      $('#c-prev').hidden = ready || seg === 0
      $('#c-dial').classList.toggle('idle', ready)
      if (ready) $('#c-tip').textContent = seg > 0 ? t('compassResume') : t('compassReady')
      const gps = $('#c-gps')
      if (!gps.hidden) gps.textContent = gps.dataset.far ? t('gpsFar', {m: gps.dataset.m}) : `✓ ${t('gpsNear')}`
    }

    const tickCompass = () => {
      if (!compassOn) return
      requestAnimationFrame(tickCompass)
      if (compassState !== 'walking' || heading == null || farEnd == null) return
      const m = ROUTE[seg]
      const want = (farEnd + Math.atan2(m.dx, m.dy) / RAD + 360) % 360
      const d = ((want - heading + 540) % 360) - 180          // + = the way to go is to your right
      needleAngle += ((d - needleAngle) % 360 + 540) % 360 - 180
      $('#c-needle').style.transform = `rotate(${needleAngle.toFixed(1)}deg)`
      $('#c-needle .arrow').style.fill = m.ink ? '' : '#cfd6ff'
      const now = Math.abs(d) < 22
      if (now !== aligned) {
        aligned = now
        $('#c-dial').classList.toggle('on', aligned)
        $('#c-trot').classList.toggle('go', aligned)
        if (aligned && navigator.vibrate) navigator.vibrate(35)
      }
      $('#c-tip').textContent = unreliable ? t('calibrate') : ''
    }

    const noCompass = () => {
      $('#c-tip').textContent = t('noCompass')
      $('#c-diary').hidden = false
    }

    $('#c-next').addEventListener('click', () => {
      if (compassState === 'ready') {
        const asked = listenCompass()   // first thing in the tap, for iPhones
        $('#c-next').disabled = true
        asked.then((ok) => (ok ? waitFor(() => heading != null, 3000) : false)).then((got) => {
          $('#c-next').disabled = false
          if (!got) return noCompass()
          farEnd = heading
          compassState = 'walking'
          aligned = false
          keepAwake()
          renderCompass()
        })
        return
      }
      seg++
      if (navigator.vibrate) navigator.vibrate(40)
      if (seg >= N) return finish()
      saveProgress()
      aligned = false
      $('#c-dial').classList.remove('on')
      $('#c-trot').classList.remove('go')
      renderCompass()
    })
    $('#c-prev').addEventListener('click', () => {
      if (seg > 0) seg--
      saveProgress()
      renderCompass()
    })
    $('#c-diary').addEventListener('click', () => startDiary(seg))
    $('#c-exit').addEventListener('click', () => {
      stopCompass()
      letSleep()
      mode = null
      show('s-start')
    })

    // ---------- The key: one tooth per tree, set over the camera view ----------
    // The word is encrypted with the tooth sequence (tools/lock.mjs), so it isn't in the page
    // and only the right sequence can reveal it.
    const KEYSTORE = `urbanquest-key-${RIDDLE_ID}`
    const TREE_H = [0, 12, 22, 32, 42]   // height of a tooth for each level, in key units
    let teeth = []
    let sel = 0
    let keyStream = null
    let keyBusy = false
    let keyTimer = 0
    let wrongSaid = -1e9
    const teethCount = () => get(riddle, 'key.lock.teeth') || get(riddle, 'key.teeth') || 23
    const levelCount = () => Math.min(4, get(riddle, 'key.levels') || 4)
    const levelName = (v) => (get(UI[lang], 'levels') || UI.en.levels)[v - 1] || String(v)

    // A tooth is a brass post with a little tree on top; an empty tooth is a dashed stub.
    const toothSvg = (x, base, level, w, on) => {
      if (!level) return `<rect x="${x - w / 2 + 2}" y="${base - 7}" width="${w - 4}" height="7" rx="2" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.2" stroke-dasharray="2 2"/>`
      const h = TREE_H[level]
      const r = w * 0.5
      return `<rect x="${x - w * 0.18}" y="${base - h + r}" width="${w * 0.36}" height="${h - r}" fill="#c9a24a"/>`
        + `<circle cx="${x}" cy="${base - h + r}" r="${r}" fill="${on ? '#56c271' : '#3f9f5c'}" stroke="#1f5a33" stroke-width="1"/>`
    }
    const keySvg = () => {
      const n = teethCount()
      const tw = 14
      const x0 = 60
      const base = 62
      const W = x0 + n * tw + 24
      let s = `<svg viewBox="0 0 ${W} 104">`
      // The bow and the blade
      s += `<circle cx="30" cy="73" r="25" fill="#d8b55e" stroke="#8a6a24" stroke-width="3"/><circle cx="30" cy="73" r="10" fill="#141a36" stroke="#8a6a24" stroke-width="2"/>`
      s += `<path d="M52 ${base}H${x0 + n * tw}L${W - 4} 73L${x0 + n * tw} 84H52Z" fill="#d8b55e" stroke="#8a6a24" stroke-width="2"/>`
      s += `<path d="M58 75H${x0 + n * tw - 4}" stroke="#a88838" stroke-width="2"/>`
      for (let i = 0; i < n; i++) {
        const x = x0 + i * tw + tw / 2
        const on = i === sel
        s += `<g class="tooth${on ? ' sel' : ''}" data-i="${i}">`
        s += `<rect class="mark" x="${x - tw / 2}" y="6" width="${tw}" height="${base - 6}" rx="4" fill="rgba(255,201,74,.22)" stroke="${C.gold}" stroke-width="1.5"/>`
        s += toothSvg(x, base, teeth[i] || 0, tw - 2, on)
        if ((i + 1) % 5 === 0 || on) s += `<text x="${x}" y="99" text-anchor="middle" font-size="${on ? 12 : 9}" font-weight="${on ? 700 : 400}" font-family="Rubik, sans-serif" fill="${on ? C.gold : 'rgba(255,255,255,.55)'}">${i + 1}</text>`
        s += `</g>`
      }
      return s + '</svg>'
    }
    const levelIcon = (v) => {
      const h = TREE_H[v] + 6
      return `<svg viewBox="0 0 24 50" aria-hidden="true"><rect x="9.5" y="${50 - h + 7}" width="5" height="${h - 7}" fill="#c9a24a"/><circle cx="12" cy="${50 - h + 7}" r="8" fill="#56c271" stroke="#1f5a33"/></svg>`
    }

    const renderKey = () => {
      const n = teethCount()
      const svg = $('#kv-key')
      svg.outerHTML = keySvg().replace('<svg ', '<svg id="kv-key" aria-hidden="true" ')
      $('#kv-which').textContent = t('tree', {n: sel + 1, total: n})
      const lv = levelCount()
      $('#kv-levels').style.setProperty('--levels', lv)
      $('#kv-levels').innerHTML = Array.from({length: lv}, (_, k) => k + 1).map((v) =>
        `<button type="button" data-v="${v}" class="${teeth[sel] === v ? 'on' : ''}" aria-label="${esc(levelName(v))}">${levelIcon(v)}</button>`).join('')
    }
    const keySay = (lines) => {
      const text = Array.isArray(lines) ? lines.join(' ') : (lines || '')
      $('#kv-say').textContent = text
    }

    const fromB64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0))
    const tryWord = (levels) => openLock(get(riddle, 'key.lock'), levels.join(''))
    // The word only decrypts with exactly the settings it was locked with (tools/lock.mjs).
    const openLock = async (lock, secret) => {
      if (!lock || !crypto.subtle) return null
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(secret), 'PBKDF2', false, ['deriveKey'])
      const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: fromB64(lock.salt), iterations: lock.iterations, hash: 'SHA-256'},
        base, {name: 'AES-GCM', length: 256}, false, ['decrypt'])
      try {
        return new TextDecoder().decode(await crypto.subtle.decrypt({name: 'AES-GCM', iv: fromB64(lock.iv)}, key, fromB64(lock.data)))
      } catch {
        return null
      }
    }

    const saveTeeth = () => store.set(KEYSTORE, JSON.stringify(teeth))
    const queueCheck = () => {
      clearTimeout(keyTimer)
      if (teeth.every(Boolean)) keyTimer = setTimeout(checkKey, 450)
    }
    const checkKey = async () => {
      if (keyBusy || !teeth.every(Boolean)) return
      keyBusy = true
      const panelEl = $('#kv-panel')
      panelEl.classList.add('turning')
      const word = await tryWord(teeth)
      panelEl.classList.remove('turning')
      keyBusy = false
      if (word) return keyOpens(word)
      panelEl.classList.remove('jiggle')
      void panelEl.offsetWidth
      panelEl.classList.add('jiggle')
      if (navigator.vibrate) navigator.vibrate([30, 60, 30])
      if (performance.now() - wrongSaid > 4000) {
        wrongSaid = performance.now()
        keySay(get(riddle, `key.udi.wrong.${lang}`))
      }
    }
    const keyOpens = (word) => {
      $('#kv-panel').classList.add('open')
      if (navigator.vibrate) navigator.vibrate(80)
      keySay(get(riddle, `key.udi.right.${lang}`))
      setTimeout(() => {
        stopKey()
        $('#end-word').hidden = false
        $('#end-word').textContent = word
        show('s-end')
      }, 1300)
    }

    const startKey = async () => {
      const n = teethCount()
      teeth = safe(() => JSON.parse(store.get(KEYSTORE)), null) || []
      if (!Array.isArray(teeth) || teeth.length !== n) teeth = new Array(n).fill(0)
      sel = teeth.findIndex((v) => !v)
      if (sel < 0) sel = 0
      $('#kv-panel').classList.remove('open', 'jiggle', 'turning')
      document.body.classList.add('keymode')
      document.body.classList.remove('nocam')
      renderKey()
      keySay(get(riddle, `key.udi.start.${lang}`))
      keepAwake()
      try {
        keyStream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}}, audio: false})
        if (!document.body.classList.contains('keymode')) return stopKey()
        const v = $('#keycam')
        v.srcObject = keyStream
        await v.play().catch(() => {})
      } catch {
        document.body.classList.add('nocam')
      }
      queueCheck()
    }
    const stopKey = () => {
      clearTimeout(keyTimer)
      if (keyStream) keyStream.getTracks().forEach((tr) => tr.stop())
      keyStream = null
      $('#keycam').srcObject = null
      document.body.classList.remove('keymode')
      letSleep()
    }

    // Tap a tooth to pick it; pick a height to set it and move on to the next tree.
    $('#keyview').addEventListener('click', (e) => {
      const tooth = e.target.closest('.tooth')
      if (tooth) {
        sel = +tooth.dataset.i
        return renderKey()
      }
      const lv = e.target.closest('#kv-levels button')
      if (lv) {
        teeth[sel] = +lv.dataset.v
        if (sel < teeth.length - 1) sel++
        saveTeeth()
        renderKey()
        return queueCheck()
      }
      if (e.target.closest('#kv-say')) $('#kv-say').textContent = ''
    })
    // The teeth are narrow, so a tap picks the nearest tooth even between them.
    $('#keyview').addEventListener('pointerdown', (e) => {
      const svg = e.target.closest('#kv-key')
      if (!svg || e.target.closest('.tooth')) return
      const pt = svg.createSVGPoint()
      pt.x = e.clientX
      pt.y = e.clientY
      const p = pt.matrixTransform(svg.getScreenCTM().inverse())
      const i = Math.floor((p.x - 60) / 14)
      if (i >= 0 && i < teethCount()) {
        sel = i
        renderKey()
      }
    })
    $('#kv-prev').addEventListener('click', () => { if (sel > 0) sel--; renderKey() })
    $('#kv-next').addEventListener('click', () => { if (sel < teethCount() - 1) sel++; renderKey() })
    $('#kv-exit').addEventListener('click', () => {
      stopKey()
      show(riddle.rules ? 's-rules' : 's-intro')
    })

    // How the key works: each tooth copies one tree of the row, left to right.
    // (Made-up heights for the picture, unrelated to the real ones.)
    const keyHowArt = () => {
      const hs = [2, 1, 3, 4, 2, 3, 1]
      const xs = hs.map((_, i) => 60 + i * 40)
      return `
      <svg class="art" viewBox="0 0 360 200" role="img" aria-label="">
        <rect width="360" height="200" fill="#1d2550"/>
        <rect y="86" width="360" height="14" fill="#2c6a3c"/>
        ${hs.map((h, i) => {
          const H = 22 + h * 14
          return `<rect x="${xs[i] - 3}" y="${96 - H + 12}" width="6" height="${H - 12}" fill="#7a5a32"/><circle cx="${xs[i]}" cy="${96 - H + 12}" r="13" fill="#3f9f5c" stroke="#1f5a33" stroke-width="1.5"/>
            <path d="M${xs[i]} 104V${162 - TREE_H[h] * 0.9}" stroke="${C.gold}" stroke-width="1.5" stroke-dasharray="3 4" opacity=".7"/>`
        }).join('')}
        <circle cx="24" cy="168" r="17" fill="#d8b55e" stroke="#8a6a24" stroke-width="2.5"/><circle cx="24" cy="168" r="7" fill="#1d2550"/>
        <path d="M40 162H${xs[6] + 20}L${xs[6] + 34} 168L${xs[6] + 20} 175H40Z" fill="#d8b55e" stroke="#8a6a24" stroke-width="2"/>
        ${hs.map((h, i) => `<rect x="${xs[i] - 4}" y="${162 - TREE_H[h] * 0.9}" width="8" height="${TREE_H[h] * 0.9}" fill="#d8b55e" stroke="#8a6a24" stroke-width="1.5"/>`).join('')}
      </svg>`
    }

    // ---------- The lighting console: laid out like the square seen from Heichal HaTarbut ----------
    // Habima is at the top, and the pillars along Huberman Street are at the bottom, where the player
    // stands. Every control draws one thing on the real square: the light stripes in the ground, the
    // three little stages, the benches under the pillars, and the pillars with their glass. The word is
    // encrypted with all the settings together (tools/lock.mjs --console), so it isn't in the page and
    // only the real square's settings reveal it.
    const CVSTORE = `urbanquest-console-${RIDDLE_ID}`
    const WAVES = ['sine', 'square', 'triangle', 'saw']
    const PADS = ['', 'circle', 'square', 'triangle']
    let cv = null
    let cvBusy = false
    let cvWrong = 0
    const cvCfg = (k, fallback) => get(riddle, `console.${k}`) ?? fallback
    const cvFresh = () => ({
      faders: new Array(cvCfg('faders', 7)).fill(0),
      glass: new Array(cvCfg('faders', 7)).fill(false),
      stages: new Array(cvCfg('stages', 3)).fill(''),
      wave: '',
      benches: 0,
      stripes: 0,
    })
    const cvLoad = () => {
      const fresh = cvFresh()
      const s = safe(() => JSON.parse(store.get(CVSTORE)), null)
      if (!s || ['faders', 'glass', 'stages'].some((k) => !Array.isArray(s[k]) || s[k].length !== fresh[k].length)) return fresh
      return {...fresh, ...s}
    }
    const cvSave = () => store.set(CVSTORE, JSON.stringify(cv))
    const cvSecret = () => ['console', cv.faders.join(','), cv.glass.map((g) => (g ? 1 : 0)).join(','),
      cv.stages.map((s) => s || 'none').join(','), `${cv.wave || 'none'},${cv.benches}`, cv.stripes].join('|')
    const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

    // Little sounds: a click for each fader step, a buzz when it fails, a chord when the lights come on.
    let actx = null
    const audio = () => {
      try {
        actx = actx || new (window.AudioContext || window.webkitAudioContext)()
        if (actx.state === 'suspended') actx.resume()
        return actx
      } catch {
        return null
      }
    }
    const tone = (freq, at, dur, type = 'triangle', gain = 0.1, glide = null) => {
      const a = audio()
      if (!a) return
      const o = a.createOscillator()
      const g = a.createGain()
      const t0 = a.currentTime + at
      o.type = type
      o.frequency.setValueAtTime(freq, t0)
      if (glide) for (const [f, dt] of glide) o.frequency.linearRampToValueAtTime(f, t0 + dt)
      g.gain.setValueAtTime(0.0001, t0)
      g.gain.exponentialRampToValueAtTime(gain, t0 + Math.min(0.06, dur / 3))
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur)
      o.connect(g).connect(a.destination)
      o.start(t0)
      o.stop(t0 + dur + 0.05)
    }
    const tick = () => tone(2200, 0, 0.025, 'square', 0.012)
    const buzz = () => {
      tone(78, 0, 0.55, 'sawtooth', 0.11)
      tone(83, 0.03, 0.5, 'sawtooth', 0.07)
    }
    const fanfare = () => {
      const notes = [261.63, 392, 523.25, 659.25, 783.99]
      notes.forEach((f, i) => tone(f, i * 0.13, 2.8 - i * 0.13, i ? 'triangle' : 'sine', 0.07))
      tone(1046.5, 0.65, 2.2, 'sine', 0.05)
    }
    const mew = () => tone(700, 0, 0.4, 'sine', 0.05, [[1100, 0.12], [640, 0.36]])

    // What the controls draw. A stage pad shows the shape picked for it, seen from above.
    const padSvg = (s) => {
      const st = 'fill="rgba(255,201,74,.22)" stroke="#ffc94a" stroke-width="3" stroke-linejoin="round"'
      if (s === 'circle') return `<svg viewBox="0 0 40 40" aria-hidden="true"><circle cx="20" cy="20" r="14" ${st}/></svg>`
      if (s === 'square') return `<svg viewBox="0 0 40 40" aria-hidden="true"><rect x="7" y="7" width="26" height="26" ${st}/></svg>`
      if (s === 'triangle') return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5 35 33H5Z" ${st}/></svg>`
      return '<svg viewBox="0 0 40 40" aria-hidden="true"><text x="20" y="28" text-anchor="middle" font-size="22" font-family="Rubik, sans-serif" fill="rgba(255,255,255,.32)">?</text></svg>'
    }
    const waveIcon = (w) => {
      const d = {
        sine: 'M3 20C8 4 14 4 20 20S32 36 37 20',
        square: 'M3 28V12H20V28H37V12',
        triangle: 'M3 28 11.5 12 20 28 28.5 12 37 28',
        saw: 'M3 28 20 12V28L37 12V28',
      }[w]
      return `<svg viewBox="0 0 40 40" aria-hidden="true"><path d="${d}" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
    }
    // The pillars along Huberman Street, with the benches in front of the long middle group. Each fader is
    // one group of pillars, as many as its level, and its button puts glass around the group. The benches
    // are the wave picked for them, cut into that many benches, the way the real ones run.
    const colonnadeSvg = () => {
      const total = cv.faders.reduce((sum, n) => sum + n, 0)
      const gapU = 0.9
      const units = total + gapU * (cv.faders.length - 1)
      const slot = Math.min(16, 332 / Math.max(units, 1))
      const mid = Math.floor(cv.faders.length / 2)
      let x = (340 - slot * units) / 2
      let span = [110, 230]
      let s = '<line x1="2" y1="35" x2="338" y2="35" stroke="rgba(255,255,255,.22)" stroke-width="2"/>'
      cv.faders.forEach((n, i) => {
        if (n && cv.glass[i]) s += `<rect x="${x.toFixed(1)}" y="2" width="${(slot * n).toFixed(1)}" height="33" rx="2" fill="rgba(121,214,255,.3)" stroke="#a8e6ff" stroke-width="1"/>`
        if (n) s += `<rect x="${x.toFixed(1)}" y="2" width="${(slot * n).toFixed(1)}" height="3" fill="#b9b2a0"/>`
        for (let k = 0; k < n; k++) s += `<rect class="pillar" x="${(x + slot * (k + 0.2)).toFixed(1)}" y="5" width="${(slot * 0.6).toFixed(1)}" height="30" rx="1" fill="#e8e1cc"/>`
        if (i === mid && n > 1) span = [x + slot * 0.5, x + slot * (n - 0.5)]
        x += slot * (n + gapU)
      })
      return s + benchesSvg(span)
    }
    const benchesSvg = ([a, b]) => {
      const n = cv.benches
      const w = cv.wave
      if (!n || !w) return `<line x1="${a.toFixed(1)}" y1="46" x2="${b.toFixed(1)}" y2="46" stroke="rgba(255,255,255,.3)" stroke-width="2" stroke-dasharray="4 5"/>`
      const seg = (b - a) / n
      const gap = Math.min(0.12, 1.5 / seg)
      let s = ''
      for (let k = 0; k < n; k++) {
        const pts = []
        for (let j = 0; j <= 16; j++) {
          const u = k + gap + (1 - 2 * gap) * (j / 16)   // along the whole wave, in benches
          const f = u - k                                 // along this bench, 0 to 1
          const y = w === 'sine' ? Math.cos(Math.PI * u)
            : w === 'triangle' ? (k % 2 ? 2 * f - 1 : 1 - 2 * f)
            : w === 'square' ? (k % 2 ? -1 : 1)
            : 2 * f - 1
          pts.push(`${(a + u * seg).toFixed(1)},${(46 - 7 * y).toFixed(1)}`)
        }
        s += `<path class="bench" d="M${pts.join('L')}" fill="none" stroke="#c48b4f" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>`
      }
      return s
    }
    // Coffee all over the desk: puddles and Mitzi's paw prints. They sit on top and let taps through.
    const coffeeHtml = () => {
      const blob = (x, y, w, rot, d) => `<svg class="cv-coffee" style="left:${x}%;top:${y}%;width:${w}px;transform:rotate(${rot}deg)" viewBox="0 0 100 70" aria-hidden="true">`
        + `<path d="${d}" fill="rgba(98,58,25,.6)" stroke="rgba(70,38,14,.5)" stroke-width="2.5"/>`
        + '<ellipse cx="40" cy="26" rx="13" ry="4.5" fill="rgba(255,255,255,.26)" transform="rotate(-14 40 26)"/></svg>'
      const paw = (x, y, r) => `<svg class="cv-coffee" style="left:${x}%;top:${y}%;width:15px;transform:rotate(${r}deg)" viewBox="0 0 20 20" aria-hidden="true" fill="rgba(98,58,25,.68)">`
        + '<ellipse cx="10" cy="13" rx="4.5" ry="3.8"/><circle cx="4.5" cy="7.5" r="2"/><circle cx="8.3" cy="4.6" r="2"/><circle cx="12.3" cy="4.6" r="2"/><circle cx="16" cy="7.5" r="2"/></svg>'
      return blob(66, 14, 112, -8, 'M18 30C10 14 32 4 48 10S80 2 88 18 96 46 78 52 60 66 42 60 4 58 10 44 26 46 18 30Z')
        + blob(-4, 17, 74, 12, 'M22 20C30 6 58 8 66 20S90 30 80 46 50 64 34 54 12 34 22 20Z')
        + blob(76, 74, 60, 4, 'M30 14C44 4 70 10 74 28S62 58 44 56 16 44 20 30 24 18 30 14Z')
        + paw(84, 30, 160) + paw(90, 36, 172) + paw(83, 42, 166) + paw(90, 49, 176) + paw(84, 56, 170)
    }

    const cvScreen = (mode = '', text = '') => {
      const el = $('#cv-screen')
      el.dataset.mode = mode
      el.classList.toggle('err', mode === 'err')
      el.classList.toggle('word', mode === 'word')
      const wiped = cv && JSON.stringify(cv) === JSON.stringify(cvFresh())
      $('#cv-screen-text').textContent = mode === 'word' ? text
        : mode === 'err' ? t('cvError')
        : mode === 'loading' ? t('cvLoading')
        : wiped ? t('cvWiped') : t('cvReady')
    }
    // Udi's bubble floats over the top of the desk and goes away by itself, or with a tap.
    let sayTimer = 0
    let saidAt = 0
    const cvSay = (text, ms = 11000, kind = '') => {
      clearTimeout(sayTimer)
      saidAt = performance.now()
      const el = $('#cv-say')
      el.textContent = text || ''
      el.dataset.kind = kind
      if (text && ms) sayTimer = setTimeout(() => { el.textContent = '' }, ms)
    }
    // It lets taps through, and makes way once the player goes back to working the desk.
    $('#cv-desk').addEventListener('pointerdown', () => { if (performance.now() - saidAt > 1500) cvSay('') })

    const buildConsole = () => {
      const max = cvCfg('faderMax', 20)
      $('#cv-faders').style.setProperty('--n', cv.faders.length)
      $('#cv-faders').innerHTML = cv.faders.map((_, i) => `
        <div class="cv-ch">
          <button class="cv-glass" type="button" data-i="${i}"></button>
          <div class="cv-fader" data-i="${i}" role="slider" tabindex="0" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="${max}"><div class="cv-knob"></div></div>
          <output class="cv-val">0</output>
        </div>`).join('')
      $('#cv-pads').innerHTML = cv.stages.map((_, i) => `<button class="cv-pad" type="button" data-i="${i}" style="--i:${i}"></button>`).join('')
      $('#cv-shapes').innerHTML = WAVES.map((w) => `<button type="button" data-w="${w}">${waveIcon(w)}</button>`).join('')
      const leds = cvCfg('stripeMax', 24)
      $('#cv-leds').style.setProperty('--n', leds)
      $('#cv-leds').innerHTML = Array.from({length: leds}, (_, i) => `<i style="--i:${i}"></i>`).join('')
      $('#cv-coffee').innerHTML = coffeeHtml()
    }
    const renderConsole = () => {
      if (!cv) return
      const max = cvCfg('faderMax', 20)
      document.querySelectorAll('#cv-faders .cv-ch').forEach((ch, i) => {
        const f = ch.querySelector('.cv-fader')
        f.style.setProperty('--v', cv.faders[i] / max)
        f.setAttribute('aria-valuenow', cv.faders[i])
        f.setAttribute('aria-label', t('cvFader', {n: i + 1}))
        ch.querySelector('.cv-val').textContent = cv.faders[i]
        const g = ch.querySelector('.cv-glass')
        g.classList.toggle('on', !!cv.glass[i])
        g.setAttribute('aria-pressed', String(!!cv.glass[i]))
        g.setAttribute('aria-label', t('cvGlassN', {n: i + 1}))
      })
      document.querySelectorAll('#cv-pads .cv-pad').forEach((p, i) => {
        const s = cv.stages[i]
        p.innerHTML = padSvg(s)
        p.classList.toggle('set', !!s)
        p.setAttribute('aria-label', t('cvStage', {n: i + 1, shape: t(`cvPad.${s || 'none'}`)}))
      })
      document.querySelectorAll('#cv-shapes button').forEach((b) => {
        const on = b.dataset.w === cv.wave
        b.classList.toggle('on', on)
        b.setAttribute('aria-pressed', String(on))
        b.setAttribute('aria-label', t(`cvWave.${b.dataset.w}`))
      })
      document.querySelectorAll('.cv-step button').forEach((b) => b.setAttribute('aria-label', t(+b.dataset.d > 0 ? 'more' : 'less')))
      $('#cv-colonnade').innerHTML = colonnadeSvg()
      document.querySelectorAll('#cv-leds i').forEach((led, i) => led.classList.toggle('on', i < cv.stripes))
      $('#cv-stripes-n').textContent = cv.stripes
      $('#cv-benches-n').textContent = cv.benches
      if (!['word', 'loading'].includes($('#cv-screen').dataset.mode)) cvScreen()
    }
    const cvChanged = () => {
      tick()
      cvSave()
      renderConsole()
    }

    // Faders: drag the knob, or tap the slot above or below it to move it one step.
    const setFader = (i, v) => {
      const max = cvCfg('faderMax', 20)
      v = Math.max(0, Math.min(max, Math.round(v)))
      if (cv.faders[i] === v) return
      cv.faders[i] = v
      tick()
      const ch = $('#cv-faders').children[i]
      ch.querySelector('.cv-fader').style.setProperty('--v', v / max)
      ch.querySelector('.cv-fader').setAttribute('aria-valuenow', v)
      ch.querySelector('.cv-val').textContent = v
      $('#cv-colonnade').innerHTML = colonnadeSvg()
      if (!['word', 'loading'].includes($('#cv-screen').dataset.mode)) cvScreen()
    }
    let drag = null
    $('#cv-faders').addEventListener('pointerdown', (e) => {
      const f = e.target.closest('.cv-fader')
      if (!f || cvBusy) return
      e.preventDefault()
      f.focus({preventScroll: true})
      try { f.setPointerCapture(e.pointerId) } catch {}
      drag = {f, i: +f.dataset.i, y0: e.clientY, moved: !!e.target.closest('.cv-knob')}
    })
    $('#cv-faders').addEventListener('pointermove', (e) => {
      if (!drag) return
      if (!drag.moved && Math.abs(e.clientY - drag.y0) < 6) return
      drag.moved = true
      const r = drag.f.getBoundingClientRect()
      setFader(drag.i, ((r.bottom - e.clientY - 10) / (r.height - 20)) * cvCfg('faderMax', 20))
    })
    const endDrag = (e) => {
      if (!drag) return
      if (!drag.moved && e.type === 'pointerup') {
        const k = drag.f.querySelector('.cv-knob').getBoundingClientRect()
        setFader(drag.i, cv.faders[drag.i] + (e.clientY < k.top + k.height / 2 ? 1 : -1))
      }
      drag = null
      cvSave()
    }
    $('#cv-faders').addEventListener('pointerup', endDrag)
    $('#cv-faders').addEventListener('pointercancel', endDrag)
    $('#cv-faders').addEventListener('keydown', (e) => {
      const f = e.target.closest('.cv-fader')
      if (!f || cvBusy) return
      const i = +f.dataset.i
      const step = {ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1, PageUp: 5, PageDown: -5}[e.key]
      if (step) setFader(i, cv.faders[i] + step)
      else if (e.key === 'Home') setFader(i, 0)
      else if (e.key === 'End') setFader(i, cvCfg('faderMax', 20))
      else return
      e.preventDefault()
      cvSave()
    })

    // Counters: tap for one more or one less, or hold to keep counting.
    let stepHeld = false
    let stepTimer = 0
    const stepBy = (btn) => {
      const k = btn.closest('.cv-step').dataset.k
      const max = cvCfg(k === 'stripes' ? 'stripeMax' : 'benchMax', 24)
      const v = Math.max(0, Math.min(max, cv[k] + +btn.dataset.d))
      if (v === cv[k]) return
      cv[k] = v
      cvChanged()
    }
    const stopStep = () => {
      clearTimeout(stepTimer)
      clearInterval(stepTimer)
    }
    $('#consoleview').addEventListener('pointerdown', (e) => {
      const btn = e.target.closest('.cv-step button')
      if (!btn || cvBusy) return
      stopStep()
      stepHeld = false
      stepTimer = setTimeout(() => {
        stepHeld = true
        stepBy(btn)
        stepTimer = setInterval(() => stepBy(btn), 110)
      }, 450)
    })
    for (const ev of ['pointerup', 'pointercancel']) $('#consoleview').addEventListener(ev, stopStep)

    const mitziHop = () => {
      const m = $('#cv-mitzi')
      m.classList.remove('hop')
      void m.offsetWidth
      m.classList.add('hop')
      mew()
      cvSay(get(riddle, `console.udi.mitzi.${lang}`))
    }
    $('#consoleview').addEventListener('click', (e) => {
      if (e.target.closest('#cv-say')) return cvSay('')
      if (e.target.closest('#cv-mitzi')) return mitziHop()
      if (cvBusy) return
      const glass = e.target.closest('.cv-glass')
      if (glass) {
        cv.glass[+glass.dataset.i] = !cv.glass[+glass.dataset.i]
        return cvChanged()
      }
      const pad = e.target.closest('.cv-pad')
      if (pad) {
        const i = +pad.dataset.i
        cv.stages[i] = PADS[(PADS.indexOf(cv.stages[i]) + 1) % PADS.length]
        return cvChanged()
      }
      const shape = e.target.closest('#cv-shapes button')
      if (shape) {
        cv.wave = shape.dataset.w
        return cvChanged()
      }
      const stepBtn = e.target.closest('.cv-step button')
      if (stepBtn) {
        if (stepHeld) {   // a long press has already counted
          stepHeld = false
          return
        }
        stepBy(stepBtn)
      }
    })

    // Udi's cue sheet, soaked in coffee: {~5} in the riddle file is a coffee stain five letters wide.
    const sheetHtml = () => {
      const line = (s) => esc(s).replace(/\{~(\d+)\}/g, (_, n) => `<span class="stain" style="width:${Math.min(12, +n)}em"></span>`)
      return `<h3 class="hand">${esc(L(get(riddle, 'console.sheet.title')))}</h3>`
        + (get(riddle, `console.sheet.${lang}`) || []).map((s) => `<p class="hand">${line(s)}</p>`).join('')
    }
    $('#cv-sheet-btn').addEventListener('click', () => {
      $('#cv-paper').innerHTML = sheetHtml()
      $('#cv-sheet').hidden = false
    })
    $('#cv-sheet-close').addEventListener('click', () => { $('#cv-sheet').hidden = true })
    $('#cv-sheet').addEventListener('click', (e) => { if (e.target.id === 'cv-sheet') $('#cv-sheet').hidden = true })

    // GO: the console tries the settings. Wrong ones sputter; the real square lights everything up.
    $('#cv-go').addEventListener('click', async () => {
      if (cvBusy) return
      cvBusy = true
      $('#cv-go').disabled = true
      cvScreen('loading')
      tone(660, 0, 0.08, 'square', 0.03)
      const [word] = await Promise.all([openLock(get(riddle, 'console.lock'), cvSecret()), wait(700)])
      if (word) return consoleLights(word)
      cvBusy = false
      $('#cv-go').disabled = false
      cvScreen('err')
      const desk = $('#cv-desk')
      desk.classList.remove('shake')
      void desk.offsetWidth
      desk.classList.add('shake')
      buzz()
      if (navigator.vibrate) navigator.vibrate([40, 60, 40])
      const lines = get(riddle, `console.udi.wrong.${lang}`) || []
      if (lines.length) cvSay(lines[cvWrong++ % lines.length])
    })
    const consoleLights = (word) => {
      $('#consoleview').classList.add('lit')
      cvScreen('word', word)
      cvSay(get(riddle, `console.udi.right.${lang}`), 0)
      fanfare()
      if (navigator.vibrate) navigator.vibrate([60, 40, 120])
      setTimeout(() => {
        stopConsole()
        $('#end-word').hidden = false
        $('#end-word').textContent = word
        show('s-end')
      }, 3400)
    }

    const startConsole = () => {
      cv = cvLoad()
      cvBusy = false
      buildConsole()
      $('#consoleview').classList.remove('lit')
      $('#cv-desk').classList.remove('shake')
      $('#cv-go').disabled = false
      $('#cv-screen').dataset.mode = ''
      const cat = get(riddle, 'art.mitziSit')
      $('#cv-mitzi').hidden = !cat
      if (cat) $('#cv-mitzi').src = cat
      document.body.classList.add('consolemode')
      renderConsole()
      cvSay(get(riddle, `console.udi.start.${lang}`), 14000, 'start')
      $('#consoleview').scrollTop = 0
      keepAwake()
    }
    const stopConsole = () => {
      document.body.classList.remove('consolemode')
      $('#cv-sheet').hidden = true
      stopStep()
      letSleep()
    }
    $('#cv-exit').addEventListener('click', () => {
      stopConsole()
      show(riddle.rules ? 's-rules' : 's-intro')
    })

    // How the console works: it is the square seen from above, the way you see it from the pillars.
    // (Made-up numbers and shapes for the picture, unrelated to the real ones.)
    const consoleHowArt = () => {
      const gold = C.gold
      const rows = [46, 82, 112, 140, 166]   // stripes, garden/screen, stages, benches, pillars
      let sq = '<rect x="16" y="12" width="148" height="188" rx="12" fill="#d8c8a2"/>'
        + '<rect x="34" y="18" width="112" height="16" rx="3" fill="#7e735f"/><rect x="44" y="22" width="92" height="3" fill="#a39780"/>'
      for (let i = 0; i < 9; i++) sq += `<rect x="${42 + i * 11.5}" y="${rows[0] - 5}" width="6" height="10" rx="1" fill="#f4e7b8" stroke="#a89060"/>`
      sq += `<rect x="50" y="${rows[1] - 14}" width="80" height="28" rx="2" fill="#5c8f4f" stroke="#3e6a35"/>`
        + `<path d="M76.7 ${rows[1] - 14}V${rows[1] + 14}M103.3 ${rows[1] - 14}V${rows[1] + 14}M50 ${rows[1] - 5}H130M50 ${rows[1] + 4}H130" stroke="#a88b5a" stroke-width="2"/>`
      for (const x of [56, 90, 124]) sq += `<circle cx="${x}" cy="${rows[2]}" r="8" fill="#b9a982" stroke="#8a7a58" stroke-width="1.5"/><text x="${x}" y="${rows[2] + 4}" text-anchor="middle" font-size="11" font-family="Rubik, sans-serif" fill="#5a4c33">?</text>`
      sq += `<path d="M40 ${rows[3]}c8-8 16-8 24 0s16 8 24 0 16-8 24 0 16 8 24 0" fill="none" stroke="#a06a34" stroke-width="3" stroke-linecap="round"/>`
      for (let i = 0; i < 12; i++) sq += `<rect x="${31 + i * 10}" y="${rows[4] - 10}" width="5" height="20" fill="#f2ecdc" stroke="#9a907a" stroke-width="1"/>`
      for (const [x, y] of [[24, 52], [24, 88], [24, 124], [156, 52], [156, 88], [156, 124]]) sq += `<circle cx="${x}" cy="${y}" r="6" fill="#5f9a52" stroke="#3e6a35" stroke-width="1.5"/>`
      sq += `<path d="M90 196c-5-6-8-9-8-13a8 8 0 0 1 16 0c0 4-3 7-8 13z" fill="${gold}" stroke="#8a6a1a" stroke-width="1.5"/><circle cx="90" cy="183" r="3" fill="#8a6a1a"/>`
      let desk = '<rect x="198" y="12" width="148" height="188" rx="14" fill="#262a3d" stroke="#0b0d17" stroke-width="3"/>'
