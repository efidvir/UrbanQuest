  <style>
    :root {
      --night: #141a36;
      --sky: #1d2550;
      --line: rgba(255, 255, 255, .16);
      --ink: #f6f0e1;
      --muted: #b8bedb;
      --gold: #ffc94a;
      --gold-ink: #2b1e00;
      --paper: #f8f0da;
      --paper-line: #e4d7b3;
      --paper-ink: #3a2e22;
      --margin: #e8a7a0;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--night); color: var(--ink); }
    body {
      font-family: Rubik, system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;

    button, a { font-family: inherit; }
    [hidden] { display: none !important; }

    #app {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      min-height: 100dvh;
      padding: calc(10px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .bar { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 40px; }
    .brand { font-size: 13px; color: var(--muted); }
    .pill {
      border: 1px solid var(--line);

      color: var(--ink);
      border-radius: 999px;
      padding: 8px 15px;
      font-size: 14px;
      font-weight: 500;

    .screen { display: none; flex-direction: column; gap: 16px; }
    .screen.on { display: flex; animation: rise .35s ease both; }

    h1, h2 { font-family: "Secular One", Rubik, sans-serif; font-weight: 400; margin: 0; line-height: 1.15; }
    h1 { font-size: 38px; color: var(--gold); }
    h2 { font-size: 27px; }
    p { margin: 0; font-size: 17px; line-height: 1.65; }
    .lead { display: flex; flex-direction: column; gap: 10px; }
    .muted { color: var(--muted); font-size: 14px; line-height: 1.5; }
    .art { display: block; width: 100%; height: auto; border-radius: 22px; background: var(--sky); direction: ltr; }

    .btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      border: 0;
      border-radius: 15px;
      padding: 15px 18px;
      font-size: 17px;
      font-weight: 700;
      line-height: 1.25;
      background: var(--gold);
      color: var(--gold-ink);
      cursor: pointer;
    }
    .btn small { display: block; font-size: 13px; font-weight: 400; opacity: .8; margin-top: 3px; }
    .btn.ghost { background: transparent; color: var(--ink); border: 1px solid rgba(255, 255, 255, .32); font-weight: 500; }
    .btn:active { transform: scale(.985); }
    .btn[disabled] { opacity: .5; pointer-events: none; }
    .stack { display: flex; flex-direction: column; gap: 10px; }

    .rules { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; counter-reset: r; }
    .rules li { counter-increment: r; display: flex; gap: 12px; align-items: flex-start; font-size: 16.5px; line-height: 1.55; }
    .rules li::before {
      content: counter(r);
      flex: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: var(--gold);
      color: var(--gold-ink);
      font-weight: 700;
      display: grid;
      place-items: center;
    }
    .badge {
      align-self: flex-start;
      font-size: 13px;
      color: var(--gold);
      border: 1px dashed rgba(255, 201, 74, .7);
      background: rgba(255, 201, 74, .1);
      border-radius: 999px;
      padding: 5px 12px;
    }

    /* Udi's diary paper */
    .paper {
      position: relative;
      background-color: var(--paper);
      color: var(--paper-ink);
      border-radius: 6px 16px 16px 6px;
      padding: 16px 18px 18px 44px;
      background-image:
        linear-gradient(to right, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px),
        repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 34px);
      box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
    }
    [dir="rtl"] .paper {
      border-radius: 16px 6px 6px 16px;
      padding: 16px 44px 18px 18px;
      background-image:
        linear-gradient(to left, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px),
        repeating-linear-gradient(to bottom, transparent 0 33px, var(--paper-line) 33px 34px);
    }
    .hand { font-family: "Playpen Sans Hebrew", Rubik, sans-serif; }
    .quote { font-size: 19px; line-height: 1.75; }
    .quote::before { content: "“"; }
    .quote::after { content: "”"; }
    [dir="rtl"] .quote::before { content: "”"; }
    [dir="rtl"] .quote::after { content: "“"; }

    /* One diary page = one stretch of path */
    .page { min-height: 250px; display: flex; flex-direction: column; gap: 14px; }
    .page.flip { animation: flip .35s ease; }
    @keyframes flip { from { opacity: .15; transform: translateX(16px) rotate(.8deg); } to { opacity: 1; transform: none; } }
    [dir="rtl"] .page.flip { animation-name: flip-rtl; }
    @keyframes flip-rtl { from { opacity: .15; transform: translateX(-16px) rotate(-.8deg); } to { opacity: 1; transform: none; } }
    .turn { display: flex; align-items: center; gap: 12px; }
    .turn svg {
      flex: none;
      width: 56px;
      height: 56px;
      padding: 6px;
      border-radius: 15px;
      color: #9a6a00;
      background: rgba(255, 201, 74, .32);
    }
    .turn strong { display: block; font-size: 23px; line-height: 1.2; color: #2a2116; }
    .turn span { display: block; font-size: 15px; color: #6b5b45; }
    .noink { font-size: 14px; color: #6b5b45; }
    .peek { position: absolute; bottom: 0; inset-inline-end: 16px; width: 66px; height: 38px; }
    .walkhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .12); overflow: hidden; }
    .progress i { display: block; height: 100%; width: 0; background: var(--gold); transition: width .3s ease; }
    .ready-title { font-family: "Secular One", Rubik, sans-serif; font-size: 24px; }

    .diary-list { list-style: none; margin: 0; display: flex; flex-direction: column; gap: 0; }
    .paper.diary-list { background-image: linear-gradient(to right, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px); }
    [dir="rtl"] .paper.diary-list { background-image: linear-gradient(to left, transparent 28px, var(--margin) 28px, var(--margin) 29.5px, transparent 29.5px); }
    .diary-list li + li { border-top: 1px solid var(--paper-line); }
    .diary-list li { display: flex; gap: 10px; align-items: flex-start; min-height: 34px; padding: 4px 0; }
    .diary-list .n { flex: none; width: 22px; font-size: 13px; color: #8a7a62; padding-top: 6px; text-align: center; }
    .diary-list svg { flex: none; width: 26px; height: 26px; color: #9a6a00; margin-top: 2px; }
    .diary-list .hand { font-size: 16px; line-height: 1.6; }

    .map-label { fill: #ece6d4; font: 500 13px Rubik, sans-serif; }

    /* Art animations: each animated part pivots on the origin of its parent group */
    .anim { transform-origin: 0 0; }
    @media (prefers-reduced-motion: no-preference) {
      .a-scratch { animation: scratch .55s ease-in-out infinite; }
      .a-bob { animation: bob 1.8s ease-in-out infinite; }
      .a-tail { animation: tail 2.2s ease-in-out infinite; }
      .a-blink { animation: blink 1.1s step-end infinite; }
      .a-tw { animation: tw 2.8s ease-in-out infinite; }
      .a-fall { animation: fall 7s linear infinite; }
      .a-z { animation: zz 3s ease-in infinite; }
      .a-ear { animation: ear 3.6s ease-in-out infinite; }
      .a-pulse { animation: pulse 1.6s ease-out infinite; }
      .a-jingle { animation: jingle 2.6s ease-in-out infinite; }
      .a-read { animation: read 4s ease-in-out infinite; }
      .a-chev { animation: chev 1.4s ease-in-out infinite; }
    }
    @keyframes scratch { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-9deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes tail { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(-16deg); } }
    @keyframes blink { 0% { opacity: 1; } 50% { opacity: .15; } }
    @keyframes tw { 0%, 100% { opacity: .95; } 50% { opacity: .25; } }
    @keyframes fall {
      0% { transform: translate(0, 0) rotate(0deg); opacity: 0; }
      8% { opacity: 1; }
      85% { opacity: 1; }
      100% { transform: translate(-40px, 190px) rotate(260deg); opacity: 0; }
    }
    @keyframes zz { 0% { transform: translate(0, 0); opacity: 0; } 25% { opacity: 1; } 100% { transform: translate(10px, -26px); opacity: 0; } }
    @keyframes ear { 0%, 86%, 100% { transform: rotate(0deg); } 90% { transform: rotate(-16deg); } 95% { transform: rotate(7deg); } }
    @keyframes pulse { 0% { transform: scale(.6); opacity: .95; } 100% { transform: scale(2.3); opacity: 0; } }
    @keyframes jingle { 0%, 80%, 100% { transform: rotate(0deg); } 85% { transform: rotate(14deg); } 90% { transform: rotate(-10deg); } 95% { transform: rotate(6deg); } }
    @keyframes read { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(3deg); } }
    @keyframes chev { 0%, 100% { opacity: .3; } 40% { opacity: 1; } }

    /* AR mode: camera feed with the diary card on top */
    #camerafeed { position: fixed; inset: 0; width: 100%; height: 100%; display: none; }
    body.ar #camerafeed { display: block; }
    body.ar #app { display: none; }
    #ar {
      position: fixed;
      inset: 0;
      z-index: 10;
      pointer-events: none;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: calc(12px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
    }
    body.ar #ar { display: flex; }
    #status {
      align-self: flex-start;
      background: rgba(20, 24, 48, .78);
      color: #fff;
      border-radius: 999px;
      padding: 8px 14px;
      font-size: 14px;
      font-weight: 500;
      transition: background .3s;
    }
    #status.good { background: rgba(22, 120, 70, .9); }
    #status.warn { background: rgba(176, 112, 0, .92); }
    #ar .bottom { display: flex; flex-direction: column; gap: 8px; max-width: 480px; width: 100%; margin: 0 auto; }
    #ar-card { pointer-events: auto; max-height: 50vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    #ar-card .turn svg { width: 46px; height: 46px; }
    #ar-card .turn strong { font-size: 19px; }
    #ar-card .quote { font-size: 16px; line-height: 1.6; }
    #ar-progress { font-size: 12px; color: #7a6a52; }
    .dist { font-size: 14px; color: #6b5b45; }
    #credit { font-size: 10px; color: rgba(255, 255, 255, .85); text-align: center; text-shadow: 0 1px 2px #000; pointer-events: auto; }
    #credit a { color: inherit; }
    #ar-exit {
      position: fixed;
      top: calc(12px + env(safe-area-inset-top));
      inset-inline-end: 14px;
      z-index: 2147483000;
      display: none;
      background: #fff;
      color: #1b1b22;
      border: 0;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
    }
    body.ar #ar-exit { display: block; }

    #error {
      position: fixed;
      inset-inline: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom));
      z-index: 2147483001;
      display: none;
      max-width: 480px;
      margin: 0 auto;
      background: rgba(170, 30, 40, .95);
      color: #fff;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>

      xr: 'https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js',

          <text class="map-label" x="180" y="${bedsY + 26 + 20}" text-anchor="middle" data-t="flowerBeds"></text>
          <g transform="translate(${px} ${py})"><circle class="anim a-pulse" r="9" fill="none" stroke="${C.gold}" stroke-width="3"/></g>
          <g transform="translate(${px} ${py})">
            <circle r="7.5" fill="${C.gold}"/>
            <path d="M0 -30L-7 -18H7Z" fill="${C.gold}"/>
            <rect x="-1.8" y="-20" width="3.6" height="11" fill="${C.gold}"/>
          </g>
          <text class="map-label" x="${labelLeft ? px + 16 : px - 16}" y="${py - 14}" text-anchor="${labelLeft ? 'start' : 'end'}" data-t="startHere"></text>
        </svg>`
    }

    // Mitzi peeking over the edge of the diary page.
    const peekArt = () => `
      <svg class="peek" viewBox="0 0 66 38" aria-hidden="true">
        <g transform="translate(18 20)"><g class="anim a-ear"><path d="M-6 0L-2 -16L7 -4Z" fill="${C.cat}"/></g></g>
        <path d="M38 16L46 0L50 18Z" fill="${C.cat}"/>
        <ellipse cx="33" cy="38" rx="22" ry="20" fill="${C.cat}"/>
        <ellipse cx="25" cy="30" rx="2.4" ry="3" fill="#2a2a33"/>
        <ellipse cx="41" cy="30" rx="2.4" ry="3" fill="#2a2a33"/>
        <path d="M31.5 35.5H34.5L33 37.5Z" fill="#f08a8f"/>
      </svg>`

    // ---------- Screens ----------
    const show = (id) => {
      document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id))
      window.scrollTo(0, 0)
      if (id === 's-start') prepareStart()
    }
    document.addEventListener('click', (e) => {
      const go = e.target.closest('[data-go]')
      if (go) show(go.dataset.go)
    })

    const pageHtml = (i) => {
      const turn = TURNS[i]
      const suffix = turn === 'back' ? t('toLastCrossing') : turn === 'straight' ? t('toCrossingStraight') : t('toCrossingTurn')
      const line = get(riddle, `diary.${lang}`)?.[i]
      return `
        <div class="turn">${turnIcon(turn)}<div><strong>${esc(t(`turn.${turn}`))}</strong><span>${esc(suffix)}</span></div></div>
        ${ROUTE[i].ink ? '' : `<p class="noink">${esc(t('noInk'))}</p>`}
        ${line ? `<p class="hand quote">${esc(line)}</p>` : ''}`
    }

    const roomText = () => {
      let x = 0, y = 0, minX = 0, maxX = 0, minY = 0, maxY = 0
      for (const m of ROUTE) {
        x += m.dx
        y += m.dy
        minX = Math.min(minX, x)
        maxX = Math.max(maxX, x)
        minY = Math.min(minY, y)
        maxY = Math.max(maxY, y)
      }
      const m = (squares) => +(squares * CELL).toFixed(1)
      const parts = []
      if (maxY) parts.push(t('ahead', {m: m(maxY)}))
      if (minY) parts.push(t('behind', {m: m(-minY)}))
      if (minX) parts.push(t('left', {m: m(-minX)}))
      if (maxX) parts.push(t('right', {m: m(maxX)}))
      return parts.join(', ')
    }

    // ---------- Progress, so a reload doesn't lose the walk ----------
    const PKEY = `urbanquest-riddle-${RIDDLE_ID}`
    const saveProgress = () => store.set(PKEY, JSON.stringify({seg, mode}))
    const loadProgress = () => safe(() => JSON.parse(store.get(PKEY) || 'null'))
    const clearProgress = () => store.del(PKEY)

    let wakeLock = null
    const keepAwake = async () => { try { wakeLock = await navigator.wakeLock?.request('screen') } catch { wakeLock = null } }
    const letSleep = () => { try { wakeLock?.release() } catch {} wakeLock = null }
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && walkingNow()) keepAwake()
    })

    const isPhone = () => matchMedia('(pointer: coarse)').matches

    const prepareStart = () => {
      const saved = loadProgress()
      const resume = $('#btn-resume')
      if (saved && saved.seg > 0 && saved.seg < N) {
        resume.hidden = false
        resume.textContent = t('resume', {n: saved.seg + 1})
      } else {
        resume.hidden = true
      }
      // Fetch the AR engine in the background, so the camera starts faster if they choose it.
      if (isPhone()) loadEngine().catch(() => {})
    }

    // ---------- Render everything in the current language ----------
    const render = () => {
      const he = lang === 'he'
      document.documentElement.lang = lang
      document.documentElement.dir = he ? 'rtl' : 'ltr'
      document.title = `${L(riddle.title)} · ${L(riddle.kicker)}`
      $('#lang').textContent = t('langName')
      $('#story').innerHTML = (get(riddle, `story.${lang}`) || []).map((p) => `<p>${esc(p)}</p>`).join('')
      $('#rules').innerHTML = (get(riddle, `rules.${lang}`) || []).map((r) => `<li>${esc(r)}</li>`).join('')
      $('#start-note').hidden = !(riddle.start && riddle.start.placeholder)
      $('#ar-sub').textContent = isPhone() ? t('startARsub') : t('arPhoneOnly')
      const room = $('#room')
      room.hidden = !params.has('cell')
      room.textContent = t('room', {room: roomText()})
      $('#diary-list').innerHTML = TURNS.map((turn, i) => `
        <li><span class="n">${i + 1}</span>${turnIcon(turn)}<span class="hand">${esc(get(riddle, `diary.${lang}`)?.[i] || t(`turn.${turn}`))}</span></li>`).join('')
      $('#to-tq').href = tqUrl()
      document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t(el.dataset.t) })
      document.querySelectorAll('[data-l]').forEach((el) => { el.textContent = L(get(riddle, el.dataset.l)) })
      if ($('#s-start').classList.contains('on')) prepareStart()
      if ($('#s-walk').classList.contains('on')) renderDiaryPage(false)
      if (document.body.classList.contains('ar')) refreshArCard()
    }
    $('#lang').addEventListener('click', () => {
      lang = lang === 'he' ? 'en' : 'he'
      store.set('urbanquest-lang', lang)
      render()
    })

    // ---------- Shared walk state ----------
    let mode = null      // 'diary' | 'ar'
    let seg = 0          // the stretch being walked now (0-based)
    let diaryState = 'ready'
    const walkingNow = () => (mode === 'diary' && $('#s-walk').classList.contains('on')) || document.body.classList.contains('ar')

    const finish = () => {
      clearProgress()
      letSleep()
      mode = null
      show('s-end')
    }

    // ---------- Diary mode: no camera, any phone ----------
    const startDiary = (from = 0) => {
      mode = 'diary'
      seg = from
      diaryState = 'ready'
      saveProgress()
      keepAwake()
      show('s-walk')
      renderDiaryPage(false)
    }
    const renderDiaryPage = (animate = true) => {
      const pageEl = $('#w-page')
      const ready = diaryState === 'ready'
      $('#w-progress').textContent = ready ? '' : t('page', {n: seg + 1, total: N})
      $('#w-bar').style.width = `${(seg / N) * 100}%`
      pageEl.innerHTML = ready
        ? `<div class="ready-title">${esc(t('readyTitle'))}</div><p>${esc(seg > 0 ? t('readyResume') : t('readyText'))}</p>${peekArt()}`
        : pageHtml(seg) + peekArt()
      $('#w-next').textContent = ready ? t('imThere') : t('atCrossing')
      $('#w-prev').hidden = ready || seg === 0
      if (animate) {
        pageEl.classList.remove('flip')
        void pageEl.offsetWidth
        pageEl.classList.add('flip')
      }
    }
    $('#w-next').addEventListener('click', () => {
      if (diaryState === 'ready') {
        diaryState = 'walking'
      } else {
        seg++
        if (navigator.vibrate) navigator.vibrate(30)
        if (seg >= N) return finish()
        saveProgress()
      }
      renderDiaryPage()
    })
    $('#w-prev').addEventListener('click', () => {
      if (seg > 0) seg--
      saveProgress()
      renderDiaryPage()
    })
    $('#w-exit').addEventListener('click', () => {
      letSleep()
      show('s-start')
    })

    $('#btn-diary').addEventListener('click', () => startDiary(0))
    $('#btn-ar').addEventListener('click', () => startAR(0))
    $('#btn-resume').addEventListener('click', () => {
      const saved = loadProgress() || {}
      const from = Math.max(0, Math.min(N - 1, saved.seg || 0))
      if (saved.mode === 'ar') startAR(from)
      else startDiary(from)
    })
    $('#btn-again').addEventListener('click', () => {
      clearProgress()
      show('s-start')
    })

    // ---------- Back to TravelQuest ----------
    // Logins there are per site, so go back to whichever TravelQuest site the player came from.
    const TQ_HOST = /(^|\.)(travelandquest\.com|travelquest\.xyz)$/i
    const fromTQ = safe(() => {
      const ref = document.referrer ? new URL(document.referrer) : null
      if (ref && TQ_HOST.test(ref.hostname)) {
        session.set('urbanquest-tq-origin', ref.origin)
        return true
      }
      return false
    }, false)
    const tqUrl = () => {
      const tq = (riddle && riddle.travelQuest) || {}
      const origin = session.get('urbanquest-tq-origin') || tq.origin || 'https://travelandquest.com'
      return origin + ((tq.path && tq.path[lang]) || (lang === 'he' ? '/iw/' : '/en/'))
    }
    $('#to-tq').addEventListener('click', (e) => {
      e.preventDefault()
      if (fromTQ && history.length > 1) {
        history.back()   // opened from TravelQuest in this tab: step back to the mission
        return
      }
      window.close()     // opened in a new tab: closing it shows TravelQuest again
      setTimeout(() => { location.href = tqUrl() }, 350)
    })

    // ---------- AR mode: arrows on the ground (8th Wall SLAM) ----------
    let THREE = null
    let enginePromise = null
    let pipelineAdded = false
    let scene, camera
    let state = 'off'            // off | loading | ready | walking | lost | failed
    let trackingSeen = false
    let limitedSince = 0
    let fwd, right, UP, Z
    let segStart = null
    let segEnd = null
    let segDir = null
    let segLen = 0
    let layer = null             // arrows + ring for the current stretch
    let arrows = []
    let crumbs = []              // drawn stretches: {mesh, born}
    let lastPos = null
    let lastHud = 0
    let chevronGeometry = null
    const GOLD = 0xFFB300
    const WHITE = 0xFFFFFF

    const loadScript = (src, attrs = {}) => new Promise((resolve, reject) => {
      const s = document.createElement('script')
      s.src = src
      s.crossOrigin = 'anonymous'
      for (const [k, v] of Object.entries(attrs)) s.setAttribute(k, v)
      s.onload = resolve
      s.onerror = () => reject(new Error(`Couldn't load ${src}`))
      document.head.appendChild(s)
    })
    const loadEngine = () => {
      enginePromise = enginePromise || (async () => {
        const three = await import('three')
        window.THREE = three  // the 8th Wall three.js module reads window.THREE
        await loadScript(ENGINE.extras)
        await loadScript(ENGINE.landing)
        const loaded = new Promise((resolve) => {
          if (window.XR8) resolve()
          else window.addEventListener('xrloaded', resolve, {once: true})
        })
        await loadScript(ENGINE.xr, {'data-preload-chunks': 'slam'})
        await loaded
        return three
      })()
      enginePromise.catch(() => { enginePromise = null })  // allow a retry later
      return enginePromise
    }

    const statusEl = $('#status')
    const setStatus = (text, cls) => { statusEl.textContent = text; statusEl.className = cls || '' }
    let arAction = null
    const arCard = (html, label, onAction, enabled = true) => {
      $('#ar-page').innerHTML = html
      const btn = $('#ar-action')
      btn.textContent = label
      btn.disabled = !enabled
      arAction = onAction
    }
    $('#ar-action').addEventListener('click', () => { if (arAction) arAction() })

    const refreshArCard = () => {
      if (state === 'ready' || state === 'loading') arReadyCard()
      else if (state === 'walking') walkingCard()
      else if (state === 'lost') lostCard()
      else if (state === 'failed') failedCard()
    }

    const groundPos = () => new THREE.Vector3(camera.position.x, 0, camera.position.z)
    const facing = () => {
      const f = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion)
      f.y = 0
      if (f.lengthSq() < 1e-6) f.set(0, 0, -1)
      return f.normalize()
    }
    const aimAxes = () => {
      fwd = facing()
      right = new THREE.Vector3().crossVectors(fwd, UP).normalize()
    }

    const buildThree = () => {
      UP = new THREE.Vector3(0, 1, 0)
      Z = new THREE.Vector3(0, 0, 1)
      fwd = new THREE.Vector3(0, 0, -1)
      right = new THREE.Vector3(1, 0, 0)
      const s = new THREE.Shape()
      s.moveTo(0, 0.2)
      s.lineTo(0.24, -0.04)
      s.lineTo(0.24, -0.17)
      s.lineTo(0, 0.07)
      s.lineTo(-0.24, -0.17)
      s.lineTo(-0.24, -0.04)
      s.closePath()
      chevronGeometry = new THREE.ExtrudeGeometry(s, {depth: 0.025, bevelEnabled: false})
      chevronGeometry.rotateX(-Math.PI / 2)  // lay flat: tip points along -Z, thickness points up
    }
    const arrowSize = () => Math.min(1, CELL)

    const flatRing = (pos, inner, outer, color) => {
      const m = new THREE.Mesh(
        new THREE.RingGeometry(inner, outer, 48),
        new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.9, side: THREE.DoubleSide})
      )
      m.rotation.x = -Math.PI / 2
      m.position.set(pos.x, 0.012, pos.z)
      return m
    }

    const clearScene = () => {
      if (scene && layer) scene.remove(layer)
      layer = null
      arrows = []
      if (scene) for (const c of crumbs) scene.remove(c.mesh)
      crumbs = []
    }

    const placeSide = (start) => {
      if (layer) scene.remove(layer)
      layer = new THREE.Group()
      arrows = []
      const move = ROUTE[seg]
      const dir = new THREE.Vector3().addScaledVector(right, move.dx).addScaledVector(fwd, move.dy)
      const len = dir.length() * CELL
      dir.normalize()
      segStart = start.clone()
      segEnd = start.clone().addScaledVector(dir, len)
      segDir = dir.clone()
      segLen = len
      const color = move.ink ? GOLD : WHITE
      const S = arrowSize()
      const n = Math.max(2, Math.round(len / 0.45))
      for (let i = 0; i < n; i++) {
        const m = new THREE.Mesh(chevronGeometry, new THREE.MeshBasicMaterial({color, transparent: true, opacity: 0.9}))
        m.position.copy(segStart.clone().lerp(segEnd, (i + 0.5) / n))
        m.position.y = 0.01
        m.rotation.y = Math.atan2(-dir.x, -dir.z)
        m.scale.setScalar(S)
        m.userData.index = i
        m.userData.base = move.ink ? 0.55 : 0.35
        layer.add(m)
        arrows.push(m)
      }
      layer.add(flatRing(segEnd, 0.16 * S, 0.24 * S, color))
      scene.add(layer)
    }

    const addCrumb = (a, b) => {
      const len = a.distanceTo(b)
      if (len < 0.05) return
      const mat = new THREE.MeshBasicMaterial({color: 0xFFD45E, transparent: true, opacity: 0.85})
      const m = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.012, len), mat)
      m.position.copy(a).add(b).multiplyScalar(0.5)
      m.position.y = 0.006
      m.quaternion.setFromUnitVectors(Z, b.clone().sub(a).normalize())
      scene.add(m)
      crumbs.push({mesh: m, born: performance.now()})
    }

    const arReadyCard = () => {
      $('#ar-progress').textContent = seg > 0 ? t('page', {n: seg + 1, total: N}) : ''
      if (!trackingSeen) {
        arCard(`<p>${esc(t('pointGround'))}</p>`, t('waiting'), null, false)
        return
      }
      arCard(`<p>${esc(seg > 0 ? t('arResume') : t('arReady'))}</p>`, t('go'), beginArWalk)
    }
    const walkingCard = () => {
      $('#ar-progress').textContent = t('page', {n: seg + 1, total: N})
      arCard(pageHtml(seg) + (AUTO ? '<p class="dist"></p>' : ''), t('atCrossing'), () => completeSide())
    }
    const lostCard = () => arCard(`<p>${esc(t('lost'))}</p>`, t('cont'), continueAfterLost)
    const failedCard = () => arCard(`<p>${esc(t('arFail'))}</p>`, t('startDiary'), () => {
      stopAR()
      startDiary(seg)
    })

    const startAR = async (from = 0) => {
      mode = 'ar'
      seg = from
      saveProgress()
      document.body.classList.add('ar')
      state = 'loading'
      trackingSeen = false
      limitedSince = 0
      setStatus(t('loadingAR'), 'warn')
      arReadyCard()
      keepAwake()
      try {
        THREE = await loadEngine()
      } catch (err) {
        state = 'failed'
        setStatus(t('loadFail'), 'warn')
        failedCard()
        return
      }
      if (!document.body.classList.contains('ar')) return  // they left while it loaded
      if (!chevronGeometry) buildThree()
      if (!pipelineAdded) {
        XR8.XrController.configure({scale: SCALE})
        XR8.addCameraPipelineModules([
          XR8.GlTextureRenderer.pipelineModule(),      // draws the camera feed
          XR8.Threejs.pipelineModule(),                // three.js scene synced to the camera
          XR8.XrController.pipelineModule(),           // SLAM world tracking
          LandingPage.pipelineModule(),                // desktop: shows a QR code to open on a phone
          XRExtras.FullWindowCanvas.pipelineModule(),  // full-screen canvas
          XRExtras.Loading.pipelineModule(),           // loading screen + camera/motion permission prompts
          XRExtras.RuntimeError.pipelineModule(),      // error screen
          walkModule(),
        ])
        pipelineAdded = true
      }
      XR8.run({canvas: $('#camerafeed')})
    }

    const stopAR = () => {
      clearScene()
      safe(() => window.XR8 && XR8.stop())
      document.body.classList.remove('ar')
      document.documentElement.removeAttribute('style')
      document.body.removeAttribute('style')
      state = 'off'
      letSleep()
    }
    $('#ar-exit').addEventListener('click', () => {
      stopAR()
      mode = null
      show('s-start')
    })

    const beginArWalk = () => {
      clearScene()
      aimAxes()
      const here = groundPos()
      placeSide(here)
      lastPos = here
      state = 'walking'
      walkingCard()
    }

    // auto: the player came within reach of the crossing, so the next stretch starts at the crossing itself.
    // A tap means "I'm at the crossing", so it starts at the player's feet: tracking drift never builds up.
    const completeSide = (auto = false) => {
      const here = groundPos()
      const anchor = auto ? segEnd.clone() : here
      if (ROUTE[seg].ink) addCrumb(segStart, anchor)
      seg++
      if (navigator.vibrate) navigator.vibrate(40)
      if (seg >= N) return finishAr()
      saveProgress()
      placeSide(anchor)
      lastPos = here
      walkingCard()
    }

    const enterLost = () => {
      state = 'lost'
      if (layer) scene.remove(layer)
      layer = null
      arrows = []
      lostCard()
    }

    const continueAfterLost = () => {
      for (const c of crumbs) scene.remove(c.mesh)  // they belong to the old, slipped frame
      crumbs = []
      aimAxes()
      seg++
      limitedSince = 0
      const here = groundPos()
      lastPos = here
      if (seg >= N) return finishAr()
      saveProgress()
      placeSide(here)
      state = 'walking'
      walkingCard()
    }

    const finishAr = () => {
      stopAR()
      finish()
    }

    // Our camera pipeline module
    const walkModule = () => ({
      name: 'udis-garden-walk',

      onStart: ({canvas}) => {
        const xr = XR8.Threejs.xrScene()
        scene = xr.scene
        camera = xr.camera
        camera.position.set(0, CAMERA_HEIGHT, 0)
        XR8.XrController.updateCameraProjectionMatrix({origin: camera.position, facing: camera.quaternion})
        canvas.addEventListener('touchmove', (e) => e.preventDefault(), {passive: false})
        setStatus(t('stMove'), 'warn')
        state = 'ready'
        arReadyCard()
        // Safety net: if no tracking event arrives, still let the player start after a few seconds.
        setTimeout(() => {
          if (trackingSeen) return
          trackingSeen = true
          if (state === 'ready') arReadyCard()
        }, 5000)
      },

      onUpdate: () => {
        if (!scene) return
        const now = performance.now()
        const tt = now / 1000

        // Light runs along the arrows in the walking direction.
        const S = arrowSize()
        for (const a of arrows) {
          const wave = Math.max(0, Math.sin(tt * 4 - a.userData.index * 0.8))
          a.scale.setScalar(S * (1 + 0.25 * wave))
          a.material.opacity = a.userData.base + (1 - a.userData.base) * wave
        }

        // Drawn stretches fade away, so the picture only exists in the player's head.
        if (!KEEP_TRAIL) {
          crumbs = crumbs.filter((c) => {
            const k = (now - c.born) / FADE_MS
            if (k >= 1) { scene.remove(c.mesh); return false }
            c.mesh.material.opacity = 0.85 * (1 - k)
            return true
          })
        }

        if (state !== 'walking') return
        const here = groundPos()

        // A sudden jump, or weak tracking for a while, means the world origin slipped.
        if (lastPos && here.distanceTo(lastPos) > JUMP) return enterLost()
        if (limitedSince && now - limitedSince > LOST_AFTER_MS) return enterLost()
        lastPos = here

        if (!AUTO) return
        // Arrived = near the crossing and well along the stretch (so turning straight back can't skip a page).
        const arrive = Math.min(0.9, Math.max(0.25, 0.35 * segLen))
        const dist = here.distanceTo(segEnd)
        const along = here.clone().sub(segStart).dot(segDir)
        if (dist < arrive && along > 0.6 * segLen) return completeSide(true)
        if (now - lastHud > 250) {
          lastHud = now
          const d = document.querySelector('#ar-page .dist')
          if (d) d.textContent = t('toGo', {d: dist.toFixed(1)})
        }
      },

      listeners: [{
        event: 'reality.trackingstatus',
        process: ({detail}) => {
          const {status, reason} = detail || {}
          if (status === 'NORMAL') {
            limitedSince = 0
            setStatus(t('stGood'), 'good')
            if (!trackingSeen) {
              trackingSeen = true
              if (state === 'ready') arReadyCard()
            }
            return
          }
          if (!limitedSince) limitedSince = performance.now()
          if (reason === 'INITIALIZING') setStatus(t('stInit'), 'warn')
          else if (reason === 'TOO_MUCH_MOTION') setStatus(t('stFast'), 'warn')
          else if (reason === 'NOT_ENOUGH_TEXTURE') setStatus(t('stTexture'), 'warn')
          else setStatus(t('stLimited'), 'warn')
        },
      }],

      onCameraStatusChange: ({status}) => {
        if (status === 'failed') {
          state = 'failed'
          failedCard()
        }
      },

      onException: (err) => {
        let msg = err && err.message
        if (!msg) msg = safe(() => JSON.stringify(err), String(err))
        showError(`AR error: ${msg}`)
      },
    })

    // ---------- Start ----------
    const pickLang = () => {
      const q = params.get('lang')
      if (q === 'he' || q === 'en') return q
      const saved = store.get('urbanquest-lang')
      if (saved === 'he' || saved === 'en') return saved
      const phone = (navigator.language || '').slice(0, 2)
      if (phone === 'he' || phone === 'iw') return 'he'
      if (phone === 'en') return 'en'
      return riddle.defaultLang || 'he'
    }

    const boot = async () => {
      try {
        const res = await fetch(`riddles/${RIDDLE_ID}.json`, {cache: 'no-cache'})
        if (!res.ok) throw new Error(`HTTP ${res.status}`)
        riddle = await res.json()
        ROUTE = parseRoute(riddle.route)
      } catch (err) {
        $('#s-loading').innerHTML = `<p>${esc(UI.he.loadFail)}</p><p>${esc(UI.en.loadFail)}</p><p class="muted">${esc(err.message)}</p>`
        return
      }
      TURNS = turnsOf(ROUTE)
      N = ROUTE.length
      const cell = parseFloat(params.get('cell'))
      CELL = Math.min(8, Math.max(0.5, cell || riddle.cell || 1))
      AUTO = params.has('auto') ? params.get('auto') === '1' : (params.has('cell') ? true : !!riddle.autoAdvance)
      lang = pickLang()
      $('#art-intro').innerHTML = introArt()
      $('#art-how').innerHTML = howArt()
      $('#art-map').innerHTML = mapArt()
      $('#art-end').innerHTML = endArt()
      render()
      const first = params.get('screen')
      show(first && document.getElementById(first) ? first : 's-intro')
    }
    boot()
  </script>
</body>
</html>
